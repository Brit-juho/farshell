# 의존성·액션 갱신 PR. 저장소가 공개되고 Dependabot 이 켜지면 동작한다.
# 보안 갱신은 이 파일과 무관하게(Dependabot security updates) 따로 온다.
version: 2
updates:
  # 액션은 SHA 로 고정돼 있어(.github/workflows) 태그가 움직여도 저절로 바뀌지 않는다 — 갱신은 여기서 PR 로 본다.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  # 프런트 도구(빌드·테스트). 런타임에 올라가지 않지만 빌드 산출물을 만든다.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      frontend-tooling:
        patterns: ['*']
  # 서버 의존성: requirements-core/dev/voice.txt
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ['*']
