# 의존성·액션 갱신 PR. 저장소가 공개되고 Dependabot 이 켜지면 동작한다.
# 보안 갱신은 이 파일과 무관하게(Dependabot security updates) 따로 온다.
version: 2
updates:
  # 액션은 SHA 로 고정돼 있어(.github/workflows) 태그가 움직여도 저절로 바뀌지 않는다 — 갱신은 여기서 PR 로 본다.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  # 프런트 도구(빌드·테스트). 런타임에 올라가지 않지만 빌드 산출물을 만든다.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      frontend-tooling:
        patterns: ['*']
  # 서버 의존성: requirements-core/dev/voice.txt — 버전 업데이트 PR은 끈다.
  # 이 저장소는 `>=` 하한만 두고 CI가 매번 최신을 설치한다. Dependabot은 하한 숫자만 최신으로 올리는데, 그러면 아무것도
  # 얻지 못하면서 지원 범위만 좁아진다(numpy>=2.5·av>=19는 Python 3.12 이상 — 지원 범위의 3.11에서 음성 설치가 깨진다).
  # 취약점(보안 업데이트) PR은 이 설정과 무관하게 계속 열린다.
  # 설치는 locks/*.txt(해시 고정, scripts/lock_python.sh 로 갱신)로만 한다 — 보안 PR 이 와도 잠금은 그 스크립트로 다시 만들어야 반영된다.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
