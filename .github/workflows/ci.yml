name: CI

# 신설 (F1, 2026-09-03) — 이 저장소엔 CI가 아예 없었다. 2.0에서 프런트엔드에
# 빌드 단계가 처음 생기는 시점이라, 깨진 빌드를 사용자보다 먼저 잡기 위해 도입한다.
# 설계 근거·실측: docs/archive/v2.0/plan-2.0/80-ci-release.md 참고(로컬 전용, gitignored).

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    # 매주 일요일 03:00 KST — requirements-core.txt에 상한 핀이 없어서(§0-c),
    # 업스트림 릴리스만으로 install.sh가 사용자보다 먼저 깨질 수 있다.
    - cron: '0 18 * * 0'

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      # 아래 CSS 변수 게이트가 파이썬 스크립트다. 검사기 자체의 단위 테스트는
      # server 잡의 pytest가 돌리고, 여기서는 "실제 빌드 산출물"을 검사한다 —
      # 빌드가 있는 잡에서만 할 수 있는 일이다.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm test
      - run: npm run build
      # 2026-09-08: var(--acc-dim)이 6스킨 어디에도 정의돼 있지 않아 카드의
      # "이미 열림" 표시가 통째로 사라졌는데, 빌드도 node 테스트 261개도 전부
      # 통과했다. CSS는 미정의 var()를 에러로 만들지 않고 그 선언만 조용히
      # 버린다 — 사람 눈으로는 못 잡는 종류라 처음부터 strict로 건다.
      - name: 정의되지 않은 CSS 변수 검사
        run: python3 scripts/check_css_vars.py --strict
      - name: 산출물 형태 검증 (I2)
        run: |
          test -f frontend/dist/app.js
          test -f frontend/dist/core.js
          test -f frontend/dist/app.css
          # F4: voice/index.js가 별도 lib entry(voice.js)로 독립 빌드된다 —
          # agent/status.js가 capability 확인 후 <script type="module">로 지연
          # 주입(vite.config.js 주석 참고, Rollup 공유 청크 해시 문제 회피).
          test -f frontend/dist/voice.js
          # sw.js PRECACHE 계약: 파일명에 해시가 붙으면 오프라인 PWA가 죽는다.
          ! ls frontend/dist | grep -E '\-[0-9a-f]{8}\.'
          # 2.1.6: 상한의 대상은 **초기 페이로드**다. 청크 규칙을 뒤집으면서
          # app.js는 부팅 배선만 남은 2KB가 되고 상시 코드는 core.js로 갔다 —
          # app.js만 재면 이 게이트가 아무것도 막지 못한다.
          SIZE=$(( $(wc -c < frontend/dist/app.js) + $(wc -c < frontend/dist/core.js) ))
          echo "app.js+core.js = ${SIZE} bytes (상한 307200)"
          [ "$SIZE" -le 307200 ]
          # 지연이 지연으로 남아 있는지 — app.js가 core.js 말고 다른 청크를
          # 정적 import하면 그 청크는 상시 로드로 승격된 것이다.
          ! grep -E '^import[^;]*from *"\./(shell|panels|settings|theme-import)\.js"' frontend/dist/app.js
          VSIZE=$(wc -c < frontend/dist/voice.js)
          echo "voice.js = ${VSIZE} bytes (상한 307200)"
          [ "$VSIZE" -le 307200 ]
      - name: dist 커밋 금지 확인 (ADR-2)
        run: git check-ignore -q frontend/dist

  # I3: 문서 일관성 — 코드가 단일 진실이고 문서가 따라간다.
  #
  # 2026-09-08: `--strict`로 승격했다. 경고로 시작한 건 "처음부터 빨간 체크면
  # 아무도 안 본다"는 이유였고, 승격 조건으로 "드리프트가 0으로 안정될 것"을
  # 걸어뒀다. 그 조건이 충족됐다 — 2026-09-07·09-08 연속 드리프트 0.
  #
  # 승격을 미룰 수 없게 된 계기: 이 잡에 DESIGN.{md,ko.md} 검사
  # (check_design_md)가 추가됐는데, 경고로 두면 그 검사가 장식이 된다. 실제로
  # 승격 직전 감사에서 DESIGN 문서가 rail 항목 수(6 vs 7)와 에이전트 상태 수
  # (4 vs 5)를 틀리게 적고 있었고, 경고 모드였다면 로그만 찍고 지나갔을 것이다.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 문서 일관성 검사 (I3)
        run: python3 scripts/check_docs.py --strict

  # E1: 실브라우저 스모크. 정적 검사가 원리상 못 보는 것 — 캐스케이드가 합성된
  # 결과(자식이 부모 밖으로 나가는가, 구간별 표시/숨김) — 만 본다.
  #
  # **주간 cron에서는 안 돈다.** 그 cron의 목적은 requirements-core.txt에 상한
  # 핀이 없어 생기는 업스트림 드리프트 감시지 렌더링이 아니다. 매주 chromium을
  # 130MB 받는 건 순수 낭비다.
  #
  # 이 잡이 없던 시절에 실제로 놓친 것: rail 세션 카드의 미리보기가 카드 밖으로
  # 1008px 삐져나와 패널과 터미널 위를 덮고 있었는데, 빌드도 테스트 261개도 전부
  # 초록이었다. jsdom은 app.css를 안 읽고, 토큰 대비 검사는 색만 계산한다.
  e2e:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          # setup-python의 pip 캐시는 기본적으로 **requirements.txt/pyproject.toml만**
          # 찾는다. 이 저장소의 의존성 파일은 requirements-<프로필>.txt 세 개라 하나도
          # 안 걸리고, 액션은 그걸 경고가 아니라 **에러로** 끝낸다 — pip install도
          # pytest도 실행되기 전에 잡이 5초 만에 죽었다. 2026-09-13까지의 실행은
          # 이 단계를 통과했으니(그때는 뒤의 pytest에서 다른 이유로 실패했다)
          # 액션 쪽 동작이 바뀐 것이고, 우리 파일명은 처음부터 안 맞았다.
          # 이 잡이 실제로 설치하는 파일만 적는다.
          cache-dependency-path: |
            requirements-core.txt
            requirements-dev.txt
      # 프런트 산출물이 있어야 페이지가 뜬다 — dist/는 커밋하지 않는다(ADR-2).
      - run: npm ci
      - run: npm run build
      - run: pip install -r requirements-core.txt -r requirements-dev.txt
      # 브라우저 바이너리만. --with-deps는 시스템 패키지까지 깔아 느리고,
      # ubuntu-latest 러너에는 chromium이 필요로 하는 라이브러리가 이미 있다.
      - run: python -m playwright install chromium
      # 서버는 테스트가 직접 띄운다(격리된 VT_* 환경으로) — 여기서 따로 안 띄운다.
      # 자세한 이유는 test_e2e_smoke.py의 _isolated_env 주석 참고.
      - name: 실브라우저 스모크
        run: pytest tests/e2e -v
      # 실패 원인을 로그만으로 재구성하기 어려운 종류라(레이아웃), 스크린샷을 남긴다.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-실패-스크린샷
          path: /tmp/e2e-*.png
          if-no-files-found: ignore

  server:
    runs-on: ubuntu-latest
    # 2026-09-19 — 이 잡이 2026-09-07부터 매번 **45분을 돌다** "The hosted runner
    # lost communication with the server"로 죽었다. 그렇게 죽으면 로그가 업로드되지
    # 않아 어디서 멈췄는지조차 알 수 없다(실제로 못 봤다). 상한을 걸어 **깨끗하게
    # 실패**시킨다 — 취소된 잡은 로그가 남는다. 로컬 실측은 3.11/3.14 모두 45~70초라
    # 12분이면 정상 실행에는 한참 여유가 있다.
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
          cache: 'pip'
          # 위 e2e 잡의 주석 참고 — 파일명이 requirements.txt가 아니면 이 액션은
          # 에러로 끝난다. 이 잡은 core 하나만 설치하므로 그것만 적는다.
          cache-dependency-path: requirements-core.txt
      # requirements-voice.txt는 설치하지 않는다 — faster-whisper/torch가 수 GB.
      # 2026-09-03 실측: voice 없이 332 passed / 2 skipped (Python 3.12/3.14 확인).
      # pytest·httpx 는 이미 requirements-core.txt 에 있어 추가 설치 불필요.
      - run: pip install -r requirements-core.txt
      # `faulthandler_timeout`은 pytest 내장이다(플러그인 불필요) — 한 테스트가
      # 이 시간을 넘기면 **모든 스레드의 트레이스백을 찍는다.** 위 timeout-minutes가
      # "45분을 버리지 않는다"를 맡고, 이쪽이 "어디서 멈췄는지 말한다"를 맡는다.
      # 로컬에서 가장 느린 테스트가 3초대라 60초면 오탐이 없다.
      - run: pytest server/tests -q -o faulthandler_timeout=60
