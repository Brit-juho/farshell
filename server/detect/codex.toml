# OpenAI Codex CLI — 승인/입력 대기 프롬프트 패턴.
#
# 근거: openai/codex 공식 저장소 소스(Rust TUI), 2026-09-11 조사, HEAD 커밋 40b0409a.
#   - enter: codex-rs/tui/src/bottom_pane/approval_overlay.rs
#     https://github.com/openai/codex/blob/40b0409aa1816d2a99935cbe77da66505c05c2a0/codex-rs/tui/src/bottom_pane/approval_overlay.rs#L255-L291
#     `build_options()`가 승인 요청 종류별로 만드는 고정 문구(title) 그대로:
#       - Exec: "Would you like to run the following command?"
#       - ApplyPatch: "Would you like to make the following edits?"
#       - Permissions: "Would you like to grant these permissions?"
#   - exit: codex-rs/tui/src/status_indicator_widget.rs
#     https://github.com/openai/codex/blob/40b0409aa1816d2a99935cbe77da66505c05c2a0/codex-rs/tui/src/status_indicator_widget.rs#L246-L259
#     작업 중 상태줄에 계속 떠 있는 힌트. 테스트가 리터럴로 고정해둔 문자열
#     (`assert!(line.starts_with("Working (0s • esc to interrupt)"))`, 같은 파일
#     L441/L489) — Claude Code와 동일 문구를 codex도 그대로 쓴다(우연이 아니라
#     둘 다 "esc"를 인터럽트 키로 쓰는 컨벤션이 같다).
#
# 번호 선택지의 실제 응답 키(y/p/esc)는 아래 options 규칙으로 실측해 고정했다.
name = "codex"
# 서로 다른 대화상자 문구가 출력 이력에 공존하면 최신 종류를 판별한다.
prefer_latest_kind = true

enter = [
  "Would you like to run the following command?",
  "Would you like to make the following edits?",
  "Would you like to grant these permissions?",
]

exit = [
  "esc to interrupt",
]

# Codex 0.155.0 실측: 승인 overlay가 `› 1. Yes, proceed (y)`와 같은 번호
# 선택지를 그린다. 키 입력은 숫자가 아니라 괄호 안 단축키이므로 모바일
# 인라인 응답에는 y/p/esc를 보내야 한다. named group을 사용해 라벨과 실제
# 전송 키의 순서를 명시한다.
options = '^\s*[›❯>]?\s*\d+\.\s+(?P<label>.+?)\s+\((?P<key>y|p|esc)\)\s*$'

# 질문 화면에는 상태줄 `esc to interrupt`가 같이 떠 있다 — choice가 히트한 동안은
# exit를 무시한다(enter 우선).
ignore_exit_on = ["choice"]

# waiting 유형(kind)별 리터럴 — 여기 적힌 문구도 waiting 진입 신호다. approval은
# 위 enter가 맡는다. 2026-10-03 실측(codex 0.158.0): 질문(request_user_input)은 Plan
# 모드에서만 뜨고 `Question 1/1`/`unanswered)`/`enter to submit answer`를 그린다.
# 2026-10-06 codex 0.160.0 격리 tmux 실측: 세 유형 화면과 request_user_input
# PreToolUse의 질문/선택지를 다시 확인했다(docs/ref/agents.md).
[kinds]
plan = [
  "Implement this plan?",
]
choice = [
  "unanswered)",
  "enter to submit answer",
]
