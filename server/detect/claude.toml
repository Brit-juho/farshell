# Claude Code — 승인/입력 대기 프롬프트 패턴.
#
# enter: 이 문자열이 최근 출력 윈도우에 나타나면 waiting으로 본다.
# exit:  이 문자열이 나타나면 즉시 waiting 해제(프롬프트가 사라졌다는 신호).
#
# 코드가 아니라 이 파일을 고치는 이유: 에이전트 CLI가 업데이트되면 문구가
# 바뀐다. 그때 파이썬을 고치고 서버를 재시작하는 대신 여기 한 줄을 고친다.
# 파싱이 실패하면 그 파일만 건너뛴다 — 잘못된 패턴 하나가 서버를 죽이지 않는다.
#
# ⚠ 오탐 주의: 빌드 로그·diff에 우연히 들어갈 수 있는 짧은 문자열("Yes", "y/n")은
# 쓰지 않는다. 실제 프롬프트에만 나오는 긴 문구를 고른다.
name = "claude"

enter = [
  "Do you want to proceed?",
  "Do you want to make this edit",
  "Do you want to create",
  "Yes, and don't ask again",
  "Yes, I trust this folder",
  "Yes, I accept the risk",
]

exit = [
  "esc to interrupt",
]

# interrupt: 승인 거절(`4. No`)·ESC 중단 뒤 화면에 남는 문구. Claude Code는 이때 Stop
# 훅을 내지 않아 훅 엔트리가 working으로 남으므로, 새로 그려지는 순간 done으로 마친다.
# 2026-10-05 실측(2.1.289): `⎿  Interrupted · What should Claude do instead?`
interrupt = [
  "Interrupted · What should Claude do instead?",
]
# 문구 뒤에 응답·도구 줄(`⏺`)이 있으면 지나간 화면이다(다음 턴이 이미 시작됐다). 중단 직후
# 화면은 문구 뒤에 입력 상자밖에 없다. 화면을 다시 열 때 스크롤백에 남은 옛 문구가 지금 작업
# 중인 엔트리를 done으로 끝내지 않게 한다(Codex의 같은 키와 같은 규칙).
interrupt_stale_after = '^\s*⏺'

# N38(70-mobile.md §2) — 모바일 플릿 홈의 인라인 승인 버튼용. Claude Code의
# 번호 선택지 줄("❯ 1. Yes" / "  2. Yes, and don't ask again ..." 등)에서
# 번호(그룹 1)와 라벨(그룹 2)을 뽑는다. 매치 실패(선택지 형태가 아닌 프롬프트)
# 시 프런트는 버튼 대신 「터미널로」로 폴백한다 — 이 패턴 하나가 전부를
# 못 잡아도 안전하다.
options = '^\s*[❯>]?\s*(\d+)\.\s+(.+?)\s*$'

# waiting 유형(kind)별 리터럴 — enter와 같은 '리터럴 바이트 문자열' 규칙. 여기 적힌
# 문구도 waiting 진입 신호다. approval은 위 enter(`Do you want to proceed?` 등)가 맡는다.
# 훅이 알려주는 kind(PermissionRequest의 tool_name)가 있으면 그쪽이 이긴다.
# 2026-10-03 실측(Claude Code 2.1.287): AskUserQuestion 화면은 아래 안내줄, ExitPlanMode
# 화면은 `Would you like to proceed?`를 그린다.
[kinds]
# 2026-10-05 실측(2.1.289, 80열): ExitPlanMode 대화상자 제목이 `Claude has written up a plan
# and is ready to execute. Would you like to` / `proceed?`로 줄바꿈된다 — 좁은 PTY에서는
# `Would you like to proceed?`가 한 줄로 안 나오므로 첫 줄 문구도 넣는다.
plan = [
  "Claude has written up a plan and is ready to execute",
  "Would you like to proceed?",
  "Here is Claude's plan:",
]
choice = [
  "Enter to select · ↑/↓ to navigate",
  # 2026-10-15 실측(Claude Code 2.1.299, Final 세션): AskUserQuestion 안내줄이 이 문구로 바뀌었다.
  "Enter to select · Tab/Arrow keys to navigate",
]
