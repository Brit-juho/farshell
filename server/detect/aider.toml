#     그래서 "(Y)es/(N)o"는 aider의 모든 확인 프롬프트에 공통으로 찍히는 고정
#     리터럴이다(정확한 대소문자·괄호까지 소스 그대로).
#     실제 호출부(aider/coders/base_coder.py)의 대표 질문 두 개도 함께 넣는다
#     (변수 보간이 없는 고정 문구만 골랐다):
#       https://github.com/Aider-AI/aider/blob/5dc9490bb35f9729ef2c95d00a19ccd30c26339c/aider/coders/base_coder.py#L2226-L2229
#       https://github.com/Aider-AI/aider/blob/5dc9490bb35f9729ef2c95d00a19ccd30c26339c/aider/coders/base_coder.py#L2456-L2464
#
