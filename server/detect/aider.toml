# 풀스크린 상태줄(ratatui/ink)이 없다. confirm_ask()는 답변을 받으면 그 줄을
# 채팅 히스토리 파일에만 적고(`self.append_chat_history`), 화면에는 사용자가
# 실제로 입력한 한두 글자(y/n/a/s/d)만 에코된다 — 오탐 없이 매칭할 만큼 긴
