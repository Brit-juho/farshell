[pytest]
# I1 잔여 항목. `pytest`를 인자 없이 치면 기본적으로 rootdir 아래 전체를
# 수집하는데, 이 저장소에는 `.venv`(설치된 서드파티 테스트)와 `frontend`
# (node 테스트)가 있어 엉뚱한 것을 주워 실패한다. CI는 경로를 명시하지만
# 로컬에서는 그렇지 않으므로 여기서 고정한다.
testpaths = server/tests
# server/ 모듈을 `import main` 처럼 최상위로 임포트하는 기존 테스트 관례를 유지한다.
pythonpath = server
addopts = -q
# 멈춤 내성(resilience) — 테스트 하나가 영원히 멈추면 CI 가 6시간을 기다린다. 기한을 넘기면 thread 방식으로
# 전 스레드 스택을 찍고 끊는다(signal 방식은 C 호출 안에서 막힌 스레드를 못 끊는다). pytest-timeout 필요.
timeout = 300
timeout_method = thread
markers =
    real_tmux_hooks: tmux_hooks.install/uninstall 차단(conftest)을 끈다 — 가짜 tmux_runner로 훅 자체를 검사할 때만
