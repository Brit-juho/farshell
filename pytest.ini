[pytest]
# I1 잔여 항목. `pytest`를 인자 없이 치면 기본적으로 rootdir 아래 전체를
# 수집하는데, 이 저장소에는 `.venv`(설치된 서드파티 테스트)와 `frontend`
# (node 테스트)가 있어 엉뚱한 것을 주워 실패한다. CI는 경로를 명시하지만
# 로컬에서는 그렇지 않으므로 여기서 고정한다.
testpaths = server/tests
# server/ 모듈을 `import main` 처럼 최상위로 임포트하는 기존 테스트 관례를 유지한다.
pythonpath = server
addopts = -q
