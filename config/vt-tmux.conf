# vt-tmux.conf — farshell 격리 tmux 설정
# `tmux -L vt -f ~/.config/vt/tmux.conf`로 로드.
# 사용자 ~/.tmux.conf의 prefix/alias 영향 차단 + 일관된 동작 보장.

# 256색 + truecolor
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:RGB"

# 마우스 + scrollback
set -g mouse on
set -g history-limit 10000

# 응답성
set -g escape-time 0
set -g focus-events on

# 웹 UI가 자체 status를 그리므로 비활성
set -g status off

# session detach시 마지막 attach된 세션으로 자동 전환
set -g detach-on-destroy off

# pane border (사용자가 split 시 가독성)
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour39"

# L2: 여러 클라이언트(웹 + 맥 iTerm2 등)가 같은 세션에 동시 attach하면 tmux
# 기본 동작(가장 작은 클라이언트에 맞춤)이 창을 계속 찌그러뜨린다. "latest"는
# 가장 최근에 리사이즈/포커스한 클라이언트 기준으로만 따라간다.
# window-size는 tmux 3.1+ 전용 옵션이라 run-shell로 감싼다 — config 안에서
# 직접 쓰면 구버전 tmux가 서버 기동(첫 명령)마다 "unknown option" 에러를 낸다.
# #{socket_path}로 이 서버 자신을 정확히 가리켜(VT_TMUX_SOCKET 이름과 무관하게
# 항상 맞는 소켓), 실패해도 stderr를 버려 조용히 넘어간다(fsh doctor가 구버전을
# 별도로 경고한다).
run-shell 'tmux -S #{socket_path} set-option -g window-size latest 2>/dev/null; tmux -S #{socket_path} set-option -g aggressive-resize off 2>/dev/null'

# Prefix는 기본 C-b 유지 (사용자 .tmux.conf 영향 차단의 핵심)
