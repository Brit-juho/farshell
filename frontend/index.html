<!DOCTYPE html>
<html lang="ko" data-skin="farshell">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="macOS/Linux 터미널을 어디서든 — tmux 세션 그대로, 음성 입력, 모바일 PWA, Claude Code 연동까지. 무료·오픈소스, 내 서버에 직접 설치." data-i18n-attr="content">
  <!-- 개인 원격 접속 도구 — 터널 URL이 새어나가도 검색엔진에 잡히지 않도록 noindex.
       인증 뒤 실제 콘텐츠(터미널)라 색인될 이유도 없다. -->
  <meta name="robots" content="noindex, nofollow">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="FarShell">
  <meta property="og:title" content="FarShell — 어디서든 macOS/Linux 터미널" data-i18n-attr="content">
  <meta property="og:description" content="tmux 세션 그대로, 음성 입력, 모바일 PWA, Claude Code 연동까지. 무료·오픈소스, 내 서버에 직접 설치." data-i18n-attr="content">
  <meta property="og:image" content="/static/icon-512.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="FarShell — 어디서든 macOS/Linux 터미널" data-i18n-attr="content">
  <meta name="twitter:description" content="tmux 세션 그대로, 음성 입력, 모바일 PWA, Claude Code 연동까지. 무료·오픈소스, 내 서버에 직접 설치." data-i18n-attr="content">
  <meta name="twitter:image" content="/static/icon-512.png">
  <title>FarShell</title>
  <link rel="icon" type="image/png" href="/static/icon-192.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#17181b" id="theme-color-meta">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="stylesheet" href="/static/vendor/xterm.min.css">
  <!-- 2.1.6 타이포 교체: UI 한글의 정본 글꼴. 여기서 app.css보다 **먼저**
       링크하는 이유는 @font-face가 첫 페인트 전에 등록되어야 하기 때문이다.
       Wanted Sans는 가변(400~1000) 한 벌을 unicode-range로 92조각 나눠 놓은
       것이라, 브라우저는 화면에 실제로 뜬 글자가 속한 조각만 받는다(라틴
       1개 + 한글 몇 개, 대략 100~150KB). 이전의 IBM Plex Sans는 **라틴
       서브셋**이어서 한글이 한 글자도 들어 있지 않았고, 그래서 화면 글자의
       대부분인 한글 라벨이 OS 기본 글꼴로 떨어지고 있었다(canvas 실측으로
       확인 — Plex와 sans-serif의 '설정워크트리' 폭이 완전히 같았다). -->
  <link rel="stylesheet" href="/static/vendor/fonts/wanted-sans/WantedSansVariable.css">
  <link rel="stylesheet" href="/static/vendor/fonts/jetbrains-mono/JetBrainsMono.css">
  <link rel="stylesheet" href="/static/vendor/fonts/symbols-nerd-font/SymbolsNerdFont.css">
  <link rel="stylesheet" href="/static/dist/app.css">
  <!-- 2.1.6: app.js는 부팅 배선만 담은 2KB 진입점이고 상시 코드는 전부
       core.js에 있다(vite.config.js의 청크 규칙 참고). 이 preload가 없으면
       **브라우저가 app.js를 받아 파싱한 뒤에야** core.js를 요청해서 부팅 전에
       왕복이 하나 늘어난다 — 느린 회선·바쁜 기기에서 온보딩 화면이 그만큼
       더 오래 떠 있는다(실측: 부하 상태의 실브라우저 스모크에서 dock 테스트가
       그 사이 클릭이 막혀 무더기로 실패했다). 둘을 동시에 받게 한다. -->
  <link rel="modulepreload" href="/static/dist/core.js">
  <!-- shell.js도 같이 받는다. 이건 "지연 청크"지만 bootApp() 직후 곧바로 동적
       import되므로(vite.config.js) 지연의 의미는 **크기 게이트 분리**이지
       로딩 시점이 아니다. preload가 없으면 app.js → core.js → shell.js가
       3단 직렬 요청이 되어 HUD·레일·dock이 그만큼 늦게 뜬다(실측: 실브라우저
       스모크에서 #vt-dock이 아직 없어 dock 테스트 5건이 무너졌다).
       panels.js는 여기 넣지 않는다 — 그건 정말 열 때만 받는다. -->
  <link rel="modulepreload" href="/static/dist/shell.js">
  <!-- 92조각 중 첫 화면이 반드시 쓰는 3개만 미리 받는다. 90=라틴,
       88=가장 흔한 한글 음절 블록(가·트 등), 모노 400=수치·경로.
       나머지 조각은 unicode-range 규칙에 따라 필요할 때만 요청된다 —
       조각 전체를 preload하면 2.4MB를 매번 받는 꼴이 되므로 하지 않는다. -->
  <link rel="preload" as="font" type="font/woff2" href="/static/vendor/fonts/wanted-sans/woff2/WantedSansVariable.split.90.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="/static/vendor/fonts/wanted-sans/woff2/WantedSansVariable.split.88.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="/static/vendor/fonts/jetbrains-mono/jetbrains-mono-latin-400.woff2" crossorigin>
  <!-- 테마 부팅: 페인트 전에 data-skin 확정 (FOUC 방지).
       D1(ADR-3): 기본값이 macos → farshell로 바뀌었다. 이미 vt-skin을
       저장해 둔 사용자는 그 값을 그대로 쓴다(마이그레이션 없음) — 저장된
       값이 아예 없을 때만 새 기본값이 적용된다. 그 "없을 때"도 시스템이
       라이트 모드면 다크 스킨을 강제로 들이밀지 않고 유일한 라이트 스킨인
       notepad로 떨어진다(prefers-color-scheme 추종, D1 체크리스트) —
       사용자가 명시적으로 스킨을 고르면 그게 항상 이긴다. -->
  <script>
    (function(){
      try {
        var stored = localStorage.getItem('vt-skin');
        var valid = ['farshell','macos','catppuccin','windows','vscode','notepad','warp','linear','vercel'];
        var s;
        if (stored && valid.indexOf(stored) >= 0) {
          s = stored;
        } else {
          var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
          s = prefersLight ? 'notepad' : 'farshell';
        }
        document.documentElement.setAttribute('data-skin', s);
      } catch(e){}
    })();
  </script>
  <!-- 로그인 게이트 스타일.
       인라인으로 남는 이유는 예전과 같다 — 이 화면은 번들 CSS 도착 여부와
       무관하게 첫 페인트에 완성돼 있어야 한다(FOUC 방지). 대신 색은 전부
       `styles/theme/tokens.css`의 --color-* 토큰을 읽고, **폴백은 var()의
       두 번째 인자로만** 준다(farshell 기본 스킨 값). 하드코딩 hex를 규칙으로
       두면 토큰이 움직일 때 로그인 화면만 조용히 옛 색으로 남는다 —
       실제로 이전 버전이 애플 블루(#0a84ff)에 묶여 있어서, 앰버 액센트로
       바뀐 제품에 브라우저 기본 폼처럼 생긴 로그인이 붙어 있었다.
       (2026-11 리디자인 3단계에서 farshell 팔레트가 파랑 액센트로 바뀌어 폴백도
       같이 옮겼다.) -->
  <style>
    #login-gate{position:fixed;inset:0;z-index:100000;display:grid;place-items:center;
      padding:24px calc(20px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
      background:var(--color-bg-0,#121316);color:var(--color-txt,#ecebe8);
      font-family:var(--font-ui,-apple-system,BlinkMacSystemFont,system-ui,sans-serif);
      -webkit-font-smoothing:antialiased;}
    #login-gate[hidden]{display:none;}

    /* ── 확인 중(최초 프로브 · QR 티켓 교환) ──────────────────────────────
       링만 돌리고 끝내면 "무엇을 기다리는지"가 화면에 없다. 티켓 교환은
       비밀번호 확인과 체감 길이가 달라서(기기 등록까지 한다) 라벨을 gate.js가
       갈아끼운다 — 링은 같아도 문장이 상태를 말한다. */
    #login-spinner{display:flex;flex-direction:column;align-items:center;gap:14px;}
    #login-spinner[hidden]{display:none;}
    .login-spin-ring{width:22px;height:22px;border-radius:50%;
      border:2px solid var(--color-line-strong,rgb(255 255 255 / .14));
      border-top-color:var(--color-acc,#7aa2ff);
      animation:login-spin .7s linear infinite;}
    #login-spin-label{margin:0;font-size:var(--fs-sm,13px);color:var(--color-sub,#a9a7a2);}
    /* app.css의 vtSpin과 값이 같은 키프레임이지만, 번들 CSS 도착 전에도 돌아야
       하므로 여기 복제본을 남긴다(D6과 같은 이유). */
    @keyframes login-spin{to{transform:rotate(360deg)}}

    /* ── 폼 프레임 ────────────────────────────────────────────────────────
       라운드 사각형이 화면 한가운데 떠 있는 "로그인 카드"를 만들지 않는다.
       게이트는 전체 화면을 덮으므로 그 위에 뜰 무언가가 없고, 그림자는 높이를
       말할 때만 쓴다(DESIGN §4). 경계는 1px 선 하나. 480px 아래에서는 테두리와
       배경 단차를 아예 지워서 카드가 아니라 **화면 자체**가 되게 한다 —
       390px 폭에서 20px 여백 안에 카드를 또 그리면 남는 폭이 없다. */
    #login-form{width:min(380px,100%);box-sizing:border-box;
      background:var(--color-bg-1,#17181b);
      border:1px solid var(--color-line,rgb(255 255 255 / .07));
      border-radius:var(--radius-lg,8px);padding:28px 24px;}
    #login-form[hidden]{display:none;}
    /* 폰(480 아래)은 카드 그대로 위에 붙인다 — 이 style 요소 맨 끝의 리디자인 8단계 블록(뒤에 와야 아래 입력·버튼 규칙을 이긴다). */

    /* 제품 표식: 자물쇠가 아니라 터미널이다. 자물쇠는 "잠겼다"만 말하고 이 화면이
       무엇인지는 말하지 않는다 — 문장이 이미 잠금을 말하고 있으니 마크는 제품을
       말하게 한다. 호스트 줄은 장식이 아니라 정보다: 터널 URL이 여러 개일 때
       지금 어느 맥에 로그인하는지가 여기서만 보인다. */
    .login-mark{display:block;color:var(--color-acc,#7aa2ff);margin:0 0 14px;}
    #login-form h1{margin:0 0 6px;font-size:var(--fs-lg,22px);font-weight:var(--weight-semibold,600);
      letter-spacing:var(--tracking-tight,-0.02em);line-height:var(--leading-tight,1.2);}
    #login-form .login-sub{margin:0;font-size:var(--fs-sm,13px);color:var(--color-sub,#a9a7a2);
      line-height:var(--leading-body,1.6);}
    #login-host{margin:2px 0 0;font-family:var(--font-mono,ui-monospace,monospace);
      font-size:var(--fs-2xs,11px);color:var(--color-faint,#706e68);
      word-break:break-all;line-height:var(--leading-row,1.35);}
    .login-fields{margin-top:22px;}

    /* ── 입력 ─────────────────────────────────────────────────────────────
       라벨을 눈에 보이게 둔다. 플레이스홀더만 있으면 입력을 시작한 순간
       그 칸이 무엇이었는지가 사라지고, OTP 단계가 열리면 칸이 둘이 된다.
       글자 16px는 취향이 아니라 iOS 대응이다 — 그보다 작으면 포커스할 때
       사파리가 화면을 확대한다. */
    .login-label{display:block;margin:0 0 6px;font-size:var(--fs-xs,12px);
      color:var(--color-sub,#a9a7a2);font-weight:var(--weight-medium,500);}
    #login-form input{width:100%;box-sizing:border-box;min-height:42px;
      font-family:inherit;font-size:16px;padding:10px 12px;
      background:var(--color-bg-0,#121316);color:var(--color-txt,#ecebe8);
      border:1px solid var(--color-line,rgb(255 255 255 / .07));
      border-radius:var(--radius-sm,6px);
      transition:border-color var(--dur-fast,120ms) ease;}
    #login-form input::placeholder{color:var(--color-faint,#706e68);}
    #login-form input:hover{border-color:var(--color-line-strong,rgb(255 255 255 / .14));}
    #login-form input:focus{outline:2px solid var(--color-acc,#7aa2ff);outline-offset:2px;
      border-color:var(--color-line-strong,rgb(255 255 255 / .14));}
    /* type=password 대신 text+마스킹 사용 → Chrome 비밀번호 저장 제안 자체를 차단 (시각적 마스킹은 유지) */
    #login-pass{-webkit-text-security:disc;text-security:disc;}

    #login-pass-state{margin:6px 0 0;font-size:var(--fs-xs,12px);
      color:var(--color-st-waiting,#f2b350);line-height:var(--leading-body,1.6);}
    #login-pass-state[hidden]{display:none;}

    /* 기기 기억: 세 칸짜리 분절 선택. 라디오 자체는 숨기고 라벨이 칸이 된다 —
       위 `#login-form input` 규칙(폭 100%·높이 42px)이 라디오에도 걸리므로
       여기서 되돌린다. 선택 칸만 테두리를 진하게 하고 채우지 않는다: 채움은
       주 액션(접속 버튼) 하나뿐이다(DESIGN §10). */
    #login-remember{margin:16px 0 0;padding:0;border:0;min-width:0;}
    #login-remember[hidden]{display:none;}
    #login-remember legend{padding:0;}
    .login-remember-opts{display:flex;gap:6px;}
    .login-remember-opts label{flex:1;position:relative;cursor:pointer;}
    #login-form .login-remember-opts input{position:absolute;opacity:0;width:1px;height:1px;
      min-height:0;padding:0;margin:0;border:0;}
    .login-remember-opts span{display:flex;align-items:center;justify-content:center;
      min-height:38px;font-size:var(--fs-sm,13px);color:var(--color-sub,#a9a7a2);
      border:1px solid var(--color-line,rgb(255 255 255 / .07));
      border-radius:var(--radius-sm,6px);
      transition:border-color var(--dur-fast,120ms) ease,color var(--dur-fast,120ms) ease;}
    .login-remember-opts label:hover span{border-color:var(--color-line-strong,rgb(255 255 255 / .14));}
    .login-remember-opts input:checked + span{color:var(--color-txt,#ecebe8);
      border-color:var(--color-acc,#7aa2ff);}
    .login-remember-opts input:focus-visible + span{outline:2px solid var(--color-acc,#7aa2ff);outline-offset:2px;}
    #login-form .login-remember-hint{margin:8px 0 0;font-size:var(--fs-xs,12px);
      color:var(--color-faint,#706e68);line-height:var(--leading-body,1.6);}

    /* OTP는 "비밀번호 다음에 붙는 칸"이 아니라 **별도 단계**다. 선 하나로
       끊어 주지 않으면 처음 보는 기기에서 갑자기 칸이 하나 늘어난 것처럼만
       보인다. */
    #login-otp-wrap{margin-top:18px;padding-top:18px;
      border-top:1px solid var(--color-line,rgb(255 255 255 / .07));}
    #login-otp-wrap[hidden]{display:none;}
    #login-form .login-otp-hint{margin:0 0 10px;font-size:var(--fs-xs,12px);
      color:var(--color-sub,#a9a7a2);line-height:var(--leading-body,1.6);}
    #login-otp{font-family:var(--font-mono,ui-monospace,monospace);
      letter-spacing:.34em;text-indent:.34em;text-align:center;font-variant-numeric:tabular-nums;}

    /* ── 주 액션 ──────────────────────────────────────────────────────────
       화면에 채움 버튼은 이것 하나뿐이다(DESIGN §10). hover/active를 밝기
       필터로 만들지 않고 --color-acc-dim 토큰으로 내린다 — filter는 스킨마다
       결과가 제각각이고, macos처럼 액센트 위 잉크 대비를 따로 맞춘 스킨에서
       그 계산을 무너뜨린다. */
    #login-submit,#login-retry{width:100%;margin-top:18px;min-height:42px;
      font-family:inherit;font-size:var(--fs-base,15px);font-weight:var(--weight-semibold,600);
      letter-spacing:var(--tracking-wide,0.04em);cursor:pointer;
      background:var(--color-acc-surface,var(--color-acc,#7aa2ff));color:var(--color-acc-ink,#0b1020);
      border:1px solid transparent;border-radius:var(--radius-sm,6px);
      transition:background-color var(--dur-fast,120ms) ease;}
    #login-submit:hover:not(:disabled),#login-retry:hover{background:var(--color-acc-dim,#5b80e0);}
    #login-submit:active:not(:disabled),#login-retry:active{background:var(--color-acc-dim,#5b80e0);}
    #login-submit:focus-visible,#login-retry:focus-visible{outline:2px solid var(--color-acc,#7aa2ff);outline-offset:2px;}
    /* 제출 중에도 버튼은 disabled다. 투명도만 낮추면 "눌렀는데 아무 일도 없는"
       화면이 되므로, 라벨을 gate.js가 갈아끼우고 여기서 링을 붙인다. */
    #login-submit:disabled{background:none;color:var(--color-muted,#8c8a85);
      border-color:var(--color-line-strong,rgb(255 255 255 / .14));cursor:default;}
    #login-submit[aria-busy="true"]{display:flex;align-items:center;justify-content:center;gap:8px;}
    #login-submit[aria-busy="true"]::before{content:"";width:13px;height:13px;border-radius:50%;
      border:2px solid var(--color-line-strong,rgb(255 255 255 / .14));
      border-top-color:var(--color-muted,#8c8a85);
      animation:login-spin .7s linear infinite;}

    /* ── 오류 ─────────────────────────────────────────────────────────────
       한 줄에 다 쓰면 "인증 코드가 올바르지 않습니다 (남은 시도 2회)"처럼
       사람이 읽어야 할 문장과 서버가 알려준 수치가 같은 무게로 붙는다.
       제목은 무슨 일인지, 보조 줄은 서버가 덧붙인 사실. */
    .login-err{display:flex;gap:9px;margin-top:16px;
      font-size:var(--fs-sm,13px);line-height:var(--leading-row,1.35);}
    .login-err[hidden]{display:none;}
    .login-err svg{flex:none;margin-top:1px;color:var(--color-st-error,#f07070);}
    #login-err-msg{color:var(--color-txt,#ecebe8);}
    #login-err-detail{margin-top:3px;color:var(--color-sub,#a9a7a2);font-size:var(--fs-xs,12px);}
    #login-err-detail[hidden]{display:none;}
    /* 확인 자체가 막힌 경우(서버가 연결은 받는데 답이 없음). 비밀번호 칸을 보여 주면
       "비밀번호를 넣으면 된다"로 읽히므로 폼과 따로 두고, 다시 확인하는 버튼만 단다. */
    #login-probe{width:min(380px,100%);box-sizing:border-box;}
    #login-probe[hidden]{display:none;}
    #login-probe .login-err{margin-top:0;}
    #login-probe-msg{color:var(--color-txt,#ecebe8);}
    #login-probe-detail{margin-top:3px;color:var(--color-sub,#a9a7a2);font-size:var(--fs-xs,12px);}

    /* ?next= 로 들어온 경우(N21 공유 링크의 device 모드). 로그인 뒤 원래 열려던
       다운로드로 돌아간다는 사실을 말해 두지 않으면, 파일을 누른 사람 눈에는
       난데없는 로그인 화면이다. */
    #login-next-note{margin:16px 0 0;padding:9px 11px;
      border:1px solid var(--color-line,rgb(255 255 255 / .07));border-radius:var(--radius-sm,6px);
      font-size:var(--fs-xs,12px);color:var(--color-sub,#a9a7a2);line-height:var(--leading-body,1.6);}
    #login-next-note[hidden]{display:none;}

    /* DESIGN §11 — 모션을 끈 사용자에게는 링 대신 정지한 액센트 호가 남고,
       상태는 옆의 문장이 말한다. */
    @media (prefers-reduced-motion:reduce){
      .login-spin-ring,#login-submit[aria-busy="true"]::before,#login-form input{animation:none;transition:none;}
    }
    /* 리디자인 8단계(시안 M09 · M10) — 폰도 카드다: 위에서 112px, 좌우 16, 테두리 1px · 반경 8 · 바 면.
       예전엔 480px 아래에서 카드를 지우고 화면 가운데에 놓았는데, 키보드가 올라오면 가운데 정렬이 입력란을
       키보드 뒤로 밀었다 — 위에 붙여 두면 비밀번호 칸이 키보드 위에 남는다. 입력·버튼은 44px, 글자는 16px
       (iOS는 16px 미만 입력에 초점이 가면 화면을 확대한다). 표식은 강조색 24px 칸 + 제품 이름 한 줄. */
    @media (max-width:480px){
      #login-gate{place-items:start center;padding-top:calc(112px + env(safe-area-inset-top));
        padding-left:calc(16px + env(safe-area-inset-left));padding-right:calc(16px + env(safe-area-inset-right));}
      #login-gate:has(#login-form[hidden]){place-items:center;padding-top:24px;}
      #login-form{border-color:var(--color-line-strong,rgb(255 255 255 / .12));padding:24px 20px;}
      .login-mark{display:inline-block;vertical-align:middle;width:24px;height:24px;padding:4px;box-sizing:border-box;
        margin:0 8px 0 0;border-radius:var(--radius-sm,6px);
        background:var(--color-acc-surface,var(--color-acc,#7aa2ff));color:var(--color-acc-ink,#0b1020);}
      #login-form h1{display:inline-block;vertical-align:middle;font-size:var(--fs-lg,22px);font-weight:700;}
      #login-form input{min-height:44px;font-size:16px;}
      #login-otp{min-height:52px;font-size:var(--fs-lg,22px);}
      #login-submit,#login-retry{min-height:44px;}
    }
  </style>
</head>
<body>
  <!-- 로그인 게이트 — VT_TOKEN 설정 시 미인증 접속을 여기서 막는다 -->
  <div id="login-gate">
    <!-- 확인 중. role=status + aria-live로 스크린리더에도 단계 전환이 읽힌다
         (라벨 문구는 gate.js가 상황에 따라 바꾼다 — 프로브 / QR 기기 등록). -->
    <div id="login-spinner" role="status" aria-live="polite">
      <span class="login-spin-ring" aria-hidden="true"></span>
      <p id="login-spin-label" data-i18n>연결을 확인하는 중</p>
    </div>
    <!-- 확인이 마감(8초) 안에 안 끝났을 때 — gate.js가 문구를 채우고, 버튼은 같은 확인을 다시 한다 -->
    <div id="login-probe" hidden>
      <div class="login-err" role="alert">
        <!-- 경고 아이콘은 gate.js가 아래 #login-err의 것을 복제해 넣는다(인라인 svg 사본을 늘리지 않는다 — icons.test.js) -->
        <div>
          <div id="login-probe-msg"></div>
          <div id="login-probe-detail"></div>
        </div>
      </div>
      <button type="button" id="login-retry"><span data-i18n>다시 시도</span></button>
    </div>
    <form id="login-form" hidden autocomplete="off">
      <!-- D5: ui/icons.js와 같은 path(Lucide 'square-terminal') — 번들 로드 전에도
           보여야 해서 정적으로 둔다. 두 곳에 같은 도형이 적히는 건 알고 있고,
           그게 아이콘 라이브러리를 섞는 것보다 낫다. -->
      <svg class="login-mark" xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="m7 9 3 3-3 3"/><path d="M12 15h5"/></svg>
      <h1>FarShell</h1>
      <p class="login-sub" data-i18n>이 터미널에 접속하려면 비밀번호가 필요합니다.</p>
      <!-- 지금 어느 서버로 들어가는지. 터널 URL은 자주 바뀌고 맥이 둘일 수도 있다. -->
      <p id="login-host" hidden></p>
      <!-- 공유 링크(N21)나 노출 포트 session 모드(2.2)로 들어와 로그인이 가로챈 경우에만 뜬다 -->
      <p id="login-next-note" hidden data-i18n>로그인하면 열려던 페이지로 이어집니다.</p>

      <div class="login-fields">
        <label class="login-label" for="login-pass" data-i18n>비밀번호</label>
        <!-- type=text + CSS 마스킹: Chrome이 type=password 필드에만 붙이는 "비밀번호 저장" 팝업을 피하면서
             화면 상 노출은 -webkit-text-security로 그대로 가린다.
             readonly+onfocus 해제: Chrome은 autocomplete=off를 로그인성 필드에서 종종 무시하고
             자동완성 드롭다운을 띄운다 — 포커스 전까지 readonly로 막아 Chrome이 아예 자동완성
             대상으로 인식하지 못하게 한다(포커스 즉시 해제되므로 타이핑에는 영향 없음). -->
        <input id="login-pass" type="text" name="vt-key" autocomplete="off"
          autocorrect="off" autocapitalize="off" spellcheck="false"
          readonly onfocus="this.removeAttribute('readonly')"
          aria-label="비밀번호" aria-describedby="login-pass-state"  data-i18n-attr="aria-label"/>
        <!-- 입력 상태 — Caps Lock·한글 입력 중일 때만 뜬다(gate.js). 키를 누르기 전에는
             브라우저가 알려 주지 않아서 "영문"이라고 미리 말하지 않는다. -->
        <p id="login-pass-state" role="status" aria-live="polite" hidden></p>
        <!-- 기기 기억 기간: 처음 보는 기기에서만 나타난다(gate.js가 /api/auth/status의
             device_known으로 판단). 등록된 기기는 서버가 이 값을 무시한다.
             value는 server/auth/__init__.py의 REMEMBER_TTLS 키와 같아야 한다 —
             server/tests/test_login_remember_markup.py가 대조한다. -->
        <fieldset id="login-remember" hidden>
          <legend class="login-label" data-i18n>이 기기 기억</legend>
          <div class="login-remember-opts">
            <label><input type="radio" name="vt-remember" value="90d" checked /><span data-i18n>90일</span></label>
            <label><input type="radio" name="vt-remember" value="24h" /><span data-i18n>24시간</span></label>
            <label><input type="radio" name="vt-remember" value="1h" /><span data-i18n>1시간</span></label>
          </div>
          <p class="login-remember-hint" data-i18n>잠깐 쓰는 기기라면 짧게 고르세요. 기간이 끝나면 다시 로그인해야 합니다.</p>
        </fieldset>
        <!-- OTP 단계: 처음 보는 기기에서만, 그리고 'fsh otp setup'으로 연동한 뒤에만 나타난다 -->
        <div id="login-otp-wrap" hidden>
          <p class="login-otp-hint" data-i18n>처음 접속하는 기기입니다. 인증 앱의 6자리 코드를 입력하세요.</p>
          <label class="login-label" for="login-otp" data-i18n>인증 코드</label>
          <input id="login-otp" type="text" name="vt-otp" autocomplete="one-time-code"
            inputmode="numeric" pattern="[0-9]*" maxlength="6"
            autocorrect="off" autocapitalize="off" spellcheck="false"
            placeholder="000000" aria-label="인증 코드"  data-i18n-attr="aria-label"/>
        </div>
        <button type="submit" id="login-submit"><span id="login-submit-label" data-i18n>접속</span></button>
      </div>

      <!-- 오류는 두 줄이다: 무슨 일인지(제목) / 서버가 덧붙인 사실(보조). -->
      <div class="login-err" id="login-err" role="alert" hidden>
        <!-- ui/icons.js의 'alert-triangle'과 같은 path -->
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
        <div>
          <div id="login-err-msg"></div>
          <div id="login-err-detail" hidden></div>
        </div>
      </div>
    </form>
  </div>
  <!--vt:i18n-->
  <script src="/static/js/i18n-boot.js"></script>
  <script src="/static/js/gate.js"></script>
  <!-- D7: screenReaderMode가 터치 기기 기본 ON(M5)인데 정작 연결 끊김이 안 읽히던 문제 -->
  <div id="conn-status" role="status" aria-live="polite"></div>

  <!-- 터미널 검색 바 -->
  <div id="search-bar">
    <input id="search-input" class="vt-input" type="text" placeholder="검색..." aria-label="터미널 검색"  data-i18n-attr="placeholder,aria-label"/>
    <!-- 도형은 ui/icons.js 'chevron-down'(hydrateIcons). 이전 결과는 CSS로 뒤집는다. -->
    <button data-action="search.prev" aria-label="이전 결과" class="flipped" data-i18n-attr="aria-label"><svg data-icon="chevron-down" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg></button>
    <button data-action="search.next" aria-label="다음 결과" data-i18n-attr="aria-label"><svg data-icon="chevron-down" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg></button>
    <!-- 도형은 ui/icons.js 'x'(hydrateIcons) -->
    <button data-action="search.close" aria-label="검색 닫기" data-i18n-attr="aria-label"><svg data-icon="x" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg></button>
  </div>

  <!-- 리디자인 2단계 — 제목 막대 36(regular 이상, 맨 위 전체 폭). 내용은 shell/TitleBar.tsx(Solid, 지연 로드)가
       채운다: FarShell 메뉴 · 호스트 · 저장소 › 브랜치 › 세션 · 가운데 팔레트 입력 · 오른쪽 도구.
       compact(<720px)에서는 CSS로 통째로 숨는다(#topbar 52가 그 자리를 쓴다). -->
  <header id="vt-titlebar" aria-label="제목 막대" data-i18n-attr="aria-label">
    <!-- 720px 이상에서는 #topbar를 통째로 감추고 거기 있던 신호등·키바 버튼·윈도 캡션을 이 두 자리로 옮긴다
         (layout/menubar-slots.js). compact에서는 제자리로 돌려 놓는다. TitleBar.tsx가 마운트되면 이 두 자리를
         막대 왼쪽 끝·오른쪽 끝으로 옮긴다(id 그대로). -->
    <div id="vt-mb-lead"></div>
    <div id="vt-mb-tools"></div>
  </header>

  <!-- 상태 막대 24(regular 이상, 맨 아래 전체 폭). 내용은 shell/Hud.tsx(Solid, 지연 로드)가 채운다: 맨 왼쪽
       에이전트 칩(고정) · 토스트 메시지 칸(#vt-hud-msg, ui/toast.js) · 왼쪽 칩, 오른쪽 칩(시계 포함).
       "값이 없는 항목은 숨긴다"가 규칙이라 빈 상태에서는 아무 칩도 안 나온다.
       id·클래스가 vt-hud-*인 것은 이름만 옛것이다(토스트·테스트가 기대는 계약이라 그대로 둔다). -->
  <div id="vt-hud" role="region" aria-label="상태 막대" data-i18n-attr="aria-label"></div>

  <!-- 상단 통합 바 — 720px 이상에서는 숨는다(메뉴바가 상단의 전부). compact의 세션 진입점·키바·스니펫·⌘K가 산다. -->
  <header id="topbar">
    <div class="traffic" aria-hidden="true"><i class="c1"></i><i class="c2"></i><i class="c3"></i></div>

    <!-- 좁은 화면의 세션 진입점 — 누르면 하단 「세션」 탭과 터미널을 오간다(팝업 없음).
         2026-09-29(H1) — 모바일 헤더의 주인공. 윗줄 세션 이름 ▾, 아랫줄 "기기 · 3/5"
         (picker.js가 그린다). 따로 있던 기기 칩(#vt-env-chip)은 이 아랫줄로 합쳤다. -->
    <button id="voice-session-picker" type="button" aria-label="세션" aria-pressed="false"
      data-action="session.manager" data-i18n data-i18n-attr="aria-label">세션</button>

    <div class="spacer"></div>

    <!-- L7: 마이크를 상단바에서 이관했다(accent 버튼 1개 회수, AFTER 다이어그램의
         최종 상단바 = 탭+ +팔레트뿐). 이제 그 자리는 없고, 정적 마크업은
         #vt-rail-mic-slot(데스크톱 홈)에 있다 — dock이 뜨면 keybar.js의
         placeMicButton이 dock으로 옮긴다. 키바에는 두지 않는다(2026-09-29). -->

    <!-- L6: 커맨드 팔레트 진입점으로 재배정 — 예전엔 search.toggle(터미널 내 검색)이었다.
         팔레트가 세션·파일·명령을 아우르는 "확인" 진입점(ADR-8)이 되면서, 이 아이콘은
         모바일 포함 모든 뷰포트에서 상시 노출된다(legacy.css의 max-width:719px 숨김
         목록에서 제외). 터미널 내 검색 자체는 Ctrl/Cmd+F로 그대로
         쓸 수 있다(팔레트 `/` 접두사는 60-settings-palette.md §3부터 파일 검색으로 바뀌었다) — ⋯ 메뉴의 동일 항목("터미널 내 검색"·"빠른 열기")은 L1 잔여
         항목에서 제거했다(상단바 ↔ ⋯ 중복 제거). -->
    <!-- 리디자인 8단계 — 폰 수동 집중 모드(상단바 버튼만 — 두 손가락 두 번 탭은 핀치와 겹쳐 두지 않는다).
         누르면 상단바·아래 탭을 숨기고 키바만 남긴다(layout/mobile-focus.js, html.vt-focus). 터미널 탭에서만 보인다(CSS). -->
    <button id="vt-focus-btn" type="button" class="vt-icon-btn" data-action="focus.toggle" aria-label="집중 모드" aria-pressed="false" data-tip="집중 모드" data-tip-side="bottom" data-i18n-attr="aria-label,data-tip">
      <svg data-icon="maximize" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
    </button>
    <!-- 2026-09-29 — 모바일 키바 여닫기. 키바가 있는 기기(터치)의 터미널 탭에서만
         보인다(CSS, html.vt-has-keybar). 상태는 기기별 설정 keybar.open. -->
    <button id="keybar-open-btn" type="button" class="vt-icon-btn" aria-label="특수키 바" aria-pressed="false" data-tip="특수키 바 열기/닫기" data-tip-side="bottom" data-i18n-attr="aria-label,data-tip">
      <svg data-icon="keyboard" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
    </button>
    <!-- 2026-10-23 — 스니펫 진입점(좁은 화면). 넓은 화면에는 dock의 「스니펫」 탭과 레일 버튼이
         있지만 compact에는 둘 다 없고 하단 내비에도 자리가 없어 팔레트로만 열렸다. 좁은 화면의
         터미널 탭에서만 보인다(CSS) — 스니펫은 터미널에 넣는 것이라 다른 탭에서는 쓸 곳이 없다. -->
    <button id="snippets-open-btn" type="button" class="vt-icon-btn" data-action="snippets.show" aria-label="프롬프트 스니펫" data-tip="프롬프트 스니펫" data-tip-side="bottom" data-i18n-attr="aria-label,data-tip">
      <svg data-icon="braces" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>

       스크롤 줄의 키는 손을 뗄 때 전송한다(밀어서 스크롤하려다 눌리지 않게) —
       수식키와 방향키는 스크롤하지 않으므로 누르는 즉시 반응한다. -->
  <div id="keybar" role="toolbar" aria-label="특수키" hidden data-i18n-attr="aria-label">
    <div id="keybar-main">
      <!-- Ctrl/Alt/Shift: 탭 = 다음 한 키, 한 번 더 탭 = 고정, 누르고 있는 동안 = 적용.
           스크롤로 밀려나지 않게 따로 고정한다 — 동시 입력은 늘 같은 자리여야 한다. -->
      <div id="keybar-mods">
        <!-- 리디자인 8단계 — 폰 집중 모드에서만 마이크(#mic-btn-wrap)가 여기 첫 키로 온다(term/keybar.js placeMicButton).
             평소에는 비어 있고 CSS로 숨는다 — 키 자리를 먹지 않는다. -->
        <span id="keybar-mic-slot"></span>
        <button type="button" class="kb kb-mod" data-mod="ctrl" aria-pressed="false">Ctrl</button>
        <button type="button" class="kb kb-mod" data-mod="alt" aria-pressed="false">Alt</button>
        <button type="button" class="kb kb-mod" data-mod="shift" aria-pressed="false">Shift</button>
      </div>
      <div id="keybar-scroll">
        <button type="button" class="kb" data-key="esc">Esc</button>
        <button type="button" class="kb" data-key="tab">Tab</button>
        <button type="button" class="kb" data-key="backtab" aria-label="Shift+Tab">⇧Tab</button>
        <button type="button" class="kb" data-key="ctrlc" aria-label="Ctrl+C 중단" data-i18n-attr="aria-label">^C</button>
        <button type="button" class="kb" data-key="home">Home</button>
        <button type="button" class="kb" data-key="end">End</button>
        <button type="button" class="kb" data-key="pgup" aria-label="Page Up">PgUp</button>
        <button type="button" class="kb" data-key="pgdn" aria-label="Page Down">PgDn</button>
        <button type="button" class="kb" data-key="del" aria-label="Delete">Del</button>
        <button type="button" class="kb" data-key="prefix" aria-label="tmux prefix (Ctrl+B)">prefix</button>
        <button type="button" class="kb" data-key="f1">F1</button>
        <button type="button" class="kb" data-key="f2">F2</button>
        <button type="button" class="kb" data-key="f3">F3</button>
        <button type="button" class="kb" data-key="f4">F4</button>
        <button type="button" class="kb" data-key="f5">F5</button>
        <button type="button" class="kb" data-key="f6">F6</button>
        <button type="button" class="kb" data-key="f7">F7</button>
        <button type="button" class="kb" data-key="f8">F8</button>
        <button type="button" class="kb" data-key="f9">F9</button>
        <button type="button" class="kb" data-key="f10">F10</button>
        <button type="button" class="kb" data-key="f11">F11</button>
        <button type="button" class="kb" data-key="f12">F12</button>
      </div>
      <div id="keybar-arrows">
        <button type="button" class="kb kb-arrow" data-key="up" aria-label="위쪽 화살표" data-i18n-attr="aria-label">↑</button>
        <button type="button" class="kb kb-arrow" data-key="left" aria-label="왼쪽 화살표" data-i18n-attr="aria-label">←</button>
        <button type="button" class="kb kb-arrow" data-key="down" aria-label="아래쪽 화살표" data-i18n-attr="aria-label">↓</button>
        <button type="button" class="kb kb-arrow" data-key="right" aria-label="오른쪽 화살표" data-i18n-attr="aria-label">→</button>
      </div>
    </div>
    <div id="keybar-selection-actions" hidden>
      <span id="keybar-selection-hint" data-i18n>텍스트를 길게 눌러 선택</span>
      <button type="button" class="vt-btn sm" id="keybar-selection-all" data-i18n>모두 선택</button>
      <button type="button" class="vt-btn sm solid" id="keybar-selection-copy" data-i18n>복사</button>
      <button type="button" class="vt-btn sm quiet" id="keybar-selection-done" data-i18n>완료</button>
    </div>
  </div>

  <!-- 리디자인 8단계 — 폰의 마이크 자리(떠 있는 56px). 비어 있는 자리이고 compact에서 #mic-btn-wrap이 여기로 온다
       (term/keybar.js placeMicButton — voice.js가 그 id를 캐시하므로 새로 만들지 않고 옮긴다). 터미널 탭에서만 보이고,
       아래 탭 위 16px(키바가 열려 있으면 키바 위 16px)에 뜬다. 집중 모드에서는 마이크가 키바 첫 키로 옮겨 가 비어 있다. -->
  <div id="vt-mic-fab"></div>
  <!-- N38(70-mobile.md §1) — 하단 내비 52px 5탭. compact(<720px)에서만 보인다.
       배지는 dock 배지(shell/Dock.tsx)와 같은 소스(같은 엔드포인트)를 재사용한
       폴링이다(layout/mobile-nav.js). 「변경」·「첨부」·「설정」은 이미 있는
       data-action(scm.show/files.show/settings.show)을 그대로 위임 클릭한다
       (core/dom.js가 모든 [data-action]을 이미 배선한다) — 「세션」·「터미널」만
       새 탭 전환 로직이 필요해 data-mnav로 따로 잡는다.
       2026-09-23 — 「작업」을 「세션」으로 바꿨다: 세션 이동·이름 변경·재우기·
       완전 종료를 전부 이 탭 하나가 맡는다(헤더의 탭 줄·세션 이동 UI는 없앴다).
       「큐」는 뺐다 — 실사용이 적어 빠른 열기(:mode)에서 찾게 하고, 그 자리를
       업로드 진행 상황을 보여줄 「첨부」에 내줬다. 「더보기」는 「설정」으로 —
       파일/포트/사용량 바로가기였던 홈은 이제 곧장 설정 화면이 연다(70-mobile.md). -->
  <!-- 2.1.6: 하단 내비에 아이콘을 넣는다. 글자만 있을 때는 다섯 칸이 전부
       같은 회색 글자라, 지금 어느 탭인지와 어디를 눌러야 하는지가 **읽어야만**
       구분됐다(엄지로 쓰는 화면에서 가장 비싼 비용이다). 2026-09-29부터
       아이콘은 `<svg data-icon="이름">` 빈 자리로만 두고 도형은 ui/icons.js의
       hydrateIcons()가 채운다(예전엔 path를 복사해 둬서 「설정」 톱니가 dock과
       어긋났다). -->
  <nav id="vt-mnav-bottom" aria-label="하단 내비" data-i18n-attr="aria-label">
    <button type="button" class="vt-mnav-btn" data-mnav="fleet" aria-label="세션" aria-pressed="false" data-i18n-attr="aria-label">
      <svg data-icon="list" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg>
      <span class="vt-mnav-label" data-i18n>세션</span>
      <span class="vt-mnav-badge" id="vt-mnav-badge-waiting" hidden></span>
    </button>
    <button type="button" class="vt-mnav-btn" data-mnav="terminal" aria-label="터미널" aria-pressed="false" data-i18n-attr="aria-label">
      <svg data-icon="terminal" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg>
      <span class="vt-mnav-label" data-i18n>터미널</span>
    </button>
    <button type="button" class="vt-mnav-btn" data-mnav="changes" data-action="scm.show" aria-label="변경" aria-pressed="false" data-i18n-attr="aria-label">
      <svg data-icon="git-branch" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg>
      <span class="vt-mnav-label" data-i18n>변경</span>
      <span class="vt-mnav-badge" id="vt-mnav-badge-changes" hidden></span>
    </button>
    <!-- 파일 개편 단계 5 — 예전 「첨부」 자리. 안쪽 맨 위 「파일 | 첨부」 전환(layout/mobile-nav.js)에서 트리가 기본이고,
         마지막에 본 쪽을 ui.mobile.filesSegment(기기 설정)가 기억한다. 올리는 중 배지는 그대로 이 탭에 붙는다. -->
    <button type="button" class="vt-mnav-btn" data-mnav="files" data-action="mfiles.show" aria-label="파일" aria-pressed="false" data-i18n-attr="aria-label">
      <svg data-icon="folder" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg>
      <span class="vt-mnav-label" data-i18n>파일</span>
      <span class="vt-mnav-badge" id="vt-mnav-badge-files" hidden></span>
    </button>
    <button type="button" class="vt-mnav-btn" data-mnav="more" data-action="settings.show" aria-label="설정" aria-pressed="false" data-i18n-attr="aria-label">
      <svg data-icon="settings" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg>
      <span class="vt-mnav-label" data-i18n>설정</span>
    </button>
  </nav>

  <script src="/static/vendor/xterm.min.js"></script>
  <script src="/static/vendor/addon-fit.min.js"></script>
  <script src="/static/vendor/addon-search.min.js"></script>
  <!-- 이모지 등 wide 문자 폭 계산을 최신 유니코드 기준으로 맞춤 — 없으면 xterm.js가 구버전
       Unicode 6 폭 테이블을 써서 최근 이모지를 좁게(1칸) 오판해, 다음 글자와 겹쳐 보인다. -->
  <script src="/static/vendor/addon-unicode11.min.js"></script>
  <!-- GPU 렌더러 — 기본(DOM) 렌더러는 활발한 스트리밍(TUI 등)에서 CPU/메모리 비용이 크다.
       WebGL 우선 시도, 실패(GPU/드라이버 미지원) 시 Canvas로 폴백.
       addon-canvas.min.js(95KB)는 여기서 미리 로드하지 않는다 — WebGL이 대부분의
       환경에서 성공해 실제로는 거의 안 쓰이므로, terminal.js가 WebGL 실패를 감지한
       순간에만 동적으로 불러온다(P1). -->
  <script src="/static/vendor/addon-webgl.min.js"></script>
  <!-- E2E 암호화(nacl, ~20KB)는 ?e2e=1/#e2e=1일 때만 필요 — 그 경우에만 동기 로드해서
       terminal.js가 실행될 때 이미 window.nacl이 준비돼 있게 한다(P1). -->
  <script>
    if (/[?&#]e2e=1(&|$)/.test(location.search + location.hash)) {
      document.write('<scr' + 'ipt src="/static/vendor/nacl.min.js"></scr' + 'ipt>');
      document.write('<scr' + 'ipt src="/static/vendor/nacl-util.min.js"></scr' + 'ipt>');
    }
  </script>
  <!-- 코드 뷰어 문법 하이라이팅(P2, 127KB) — 코드 뷰어를 실제로 열 때만 viewer.js가
       동적으로 불러온다(P1). 테마 CSS는 쓰지 않는다 — 색은 app.css에서 스킨
       토큰으로 매핑해야 notepad(라이트)까지 따라간다. -->

  <!-- ESM 진입점 (Vite 산출물). legacy 기능의 의존 순서는 frontend/js/main.js
       manifest에서만 관리한다 — 소스는 main.js, 여기서 가리키는 건 그 빌드 결과. -->
  <script type="module" src="/static/dist/app.js"></script>

  <!-- ⋯ 메뉴 열고닫기 등은 js/ui/moreMenu.js로 이관했다(F3(d)) — main.js가
       import한다. -->
</body>
</html>
