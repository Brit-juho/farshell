<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>voice-terminal Terminal</title>
  <link rel="icon" type="image/png" href="/static/icon-192.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#181825">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="stylesheet" href="/static/vendor/xterm.min.css">
  <link href="/static/vendor/lucide.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <div id="conn-status"></div>
  <div id="search-bar">
    <input id="search-input" type="text" placeholder="검색..." />
    <button onclick="searchPrev()">▲</button>
    <button onclick="searchNext()">▼</button>
    <button onclick="closeSearch()">✕</button>
  </div>
  <div id="tabs">
    <div id="add-btn" onclick="createSession()"><i class="icon-plus" style="font-size:14px;vertical-align:middle;margin-right:2px"></i> New</div>
    <div id="tmux-btn" onclick="showTmuxSessions()" style="padding:8px 14px;border-radius:8px;background:#45475a;cursor:pointer;font-size:13px;flex-shrink:0;"><i class="icon-terminal" style="font-size:13px;vertical-align:middle;margin-right:3px"></i>tmux</div>
    <label id="auto-mac-toggle" title="새 세션 생성 시 맥북에서도 iTerm 창이 자동으로 열림"
      style="display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:8px;background:#313244;cursor:pointer;font-size:12px;color:#cdd6f4;flex-shrink:0;user-select:none;">
      <input type="checkbox" id="auto-mac-checkbox" style="margin:0;cursor:pointer;" />
      <i class="icon-monitor" style="font-size:13px;vertical-align:middle;"></i>
      <span>맥에서도 열기</span>
    </label>
    <div id="grid-toggle" onclick="toggleGridView()" title="모든 tmux 세션 라이브 프리뷰"
      style="padding:8px 14px;border-radius:8px;background:#45475a;cursor:pointer;font-size:13px;flex-shrink:0;">
      <i class="icon-grid" style="font-size:13px;vertical-align:middle;margin-right:3px"></i>Grid
    </div>
  </div>
  <div id="terminal-container"></div>
  <div id="grid-view" style="display:none;position:absolute;top:54px;left:0;right:0;bottom:60px;overflow-y:auto;background:#1e1e2e;padding:12px;z-index:100;">
    <div id="grid-cards" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:12px;"></div>
  </div>
  <div id="mic-status"></div>
  <div id="voice-bar">
    <select id="voice-session-picker" onchange="if(this.value)switchTo(this.value)"></select>
    <button id="mic-btn-wrap" class="voice-action" onclick="toggleRecording()">
      <div class="icon"><i class="icon-mic"></i></div>
      <span class="label">음성 입력</span>
    </button>
    <!-- W1-5: 핸즈프리 버튼 제거 (VAD 없이 "핸즈프리"라는 이름이 동작과 불일치) -->
    <button id="voiceonly-btn" class="voice-action" onclick="toggleVoiceOnly()">
      <div class="icon"><i class="icon-headphones"></i></div>
      <span class="label">음성 전용</span>
    </button>
    <!-- W2-3: 이어폰 미디어 키 트리거 ON/OFF 토글. active 클래스는 JS가 localStorage 기준으로 동기화 -->
    <button id="mediakey-btn" class="voice-action" onclick="toggleMediaKeyTrigger()">
      <div class="icon"><i class="icon-music"></i></div>
      <span class="label">이어폰</span>
    </button>
    <label class="voice-action" id="upload-btn">
      <div class="icon"><i class="icon-paperclip"></i></div>
      <span class="label">파일</span>
      <input type="file" id="file-input" style="display:none" onchange="uploadFile(this)" />
    </label>
  </div>

  <script src="/static/vendor/xterm.min.js"></script>
  <script src="/static/vendor/addon-fit.min.js"></script>
  <script src="/static/vendor/addon-search.min.js"></script>
  <!-- tweetnacl — E2E 암호화 (D3, opt-in) -->
  <script src="/static/vendor/nacl.min.js"></script>
  <script src="/static/vendor/nacl-util.min.js"></script>

  <!-- 앱 스크립트 — 전역 변수 공유를 위해 classic <script> + 원래 순서 보존 -->
  <script src="/static/js/terminal.js"></script>
  <script src="/static/js/search.js"></script>
  <script src="/static/js/picker.js"></script>
  <script src="/static/js/grid.js"></script>
</body>
</html>
