<!DOCTYPE html>
<html lang="ko" data-skin="farshell">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="macOS/Linux 터미널을 어디서든 — tmux 세션 그대로, 음성 입력, 모바일 PWA, Claude Code 연동까지. 무료·오픈소스, 내 서버에 직접 설치.">
  <!-- 개인 원격 접속 도구 — 터널 URL이 새어나가도 검색엔진에 잡히지 않도록 noindex.
       인증 뒤 실제 콘텐츠(터미널)라 색인될 이유도 없다. -->
  <meta name="robots" content="noindex, nofollow">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="FarShell">
  <meta property="og:title" content="FarShell — 어디서든 macOS/Linux 터미널">
  <meta property="og:description" content="tmux 세션 그대로, 음성 입력, 모바일 PWA, Claude Code 연동까지. 무료·오픈소스, 내 서버에 직접 설치.">
  <meta property="og:image" content="/static/icon-512.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="FarShell — 어디서든 macOS/Linux 터미널">
  <meta name="twitter:description" content="tmux 세션 그대로, 음성 입력, 모바일 PWA, Claude Code 연동까지. 무료·오픈소스, 내 서버에 직접 설치.">
  <meta name="twitter:image" content="/static/icon-512.png">
  <title>FarShell</title>
  <link rel="icon" type="image/png" href="/static/icon-192.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#131316" id="theme-color-meta">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="stylesheet" href="/static/vendor/xterm.min.css">
  <!-- 2.1.6 타이포 교체: UI 한글의 정본 글꼴. 여기서 app.css보다 **먼저**
       링크하는 이유는 @font-face가 첫 페인트 전에 등록되어야 하기 때문이다.
       Wanted Sans는 가변(400~1000) 한 벌을 unicode-range로 92조각 나눠 놓은
       것이라, 브라우저는 화면에 실제로 뜬 글자가 속한 조각만 받는다(라틴
       1개 + 한글 몇 개, 대략 100~150KB). 이전의 IBM Plex Sans는 **라틴
       서브셋**이어서 한글이 한 글자도 들어 있지 않았고, 그래서 화면 글자의
       대부분인 한글 라벨이 OS 기본 글꼴로 떨어지고 있었다(canvas 실측으로
       확인 — Plex와 sans-serif의 '설정워크트리' 폭이 완전히 같았다). -->
  <link rel="stylesheet" href="/static/vendor/fonts/wanted-sans/WantedSansVariable.css">
  <link rel="stylesheet" href="/static/vendor/fonts/jetbrains-mono/JetBrainsMono.css">
  <link rel="stylesheet" href="/static/dist/app.css">
  <!-- 2.1.6: app.js는 부팅 배선만 담은 2KB 진입점이고 상시 코드는 전부
       core.js에 있다(vite.config.js의 청크 규칙 참고). 이 preload가 없으면
       **브라우저가 app.js를 받아 파싱한 뒤에야** core.js를 요청해서 부팅 전에
       왕복이 하나 늘어난다 — 느린 회선·바쁜 기기에서 온보딩 화면이 그만큼
       더 오래 떠 있는다(실측: 부하 상태의 실브라우저 스모크에서 dock 테스트가
       그 사이 클릭이 막혀 무더기로 실패했다). 둘을 동시에 받게 한다. -->
  <link rel="modulepreload" href="/static/dist/core.js">
  <!-- shell.js도 같이 받는다. 이건 "지연 청크"지만 bootApp() 직후 곧바로 동적
       import되므로(vite.config.js) 지연의 의미는 **크기 게이트 분리**이지
       로딩 시점이 아니다. preload가 없으면 app.js → core.js → shell.js가
       3단 직렬 요청이 되어 HUD·레일·dock이 그만큼 늦게 뜬다(실측: 실브라우저
       스모크에서 #vt-dock이 아직 없어 dock 테스트 5건이 무너졌다).
       panels.js는 여기 넣지 않는다 — 그건 정말 열 때만 받는다. -->
  <link rel="modulepreload" href="/static/dist/shell.js">
  <!-- 92조각 중 첫 화면이 반드시 쓰는 3개만 미리 받는다. 90=라틴,
       88=가장 흔한 한글 음절 블록(가·트 등), 모노 400=수치·경로.
       나머지 조각은 unicode-range 규칙에 따라 필요할 때만 요청된다 —
       조각 전체를 preload하면 2.4MB를 매번 받는 꼴이 되므로 하지 않는다. -->
  <link rel="preload" as="font" type="font/woff2" href="/static/vendor/fonts/wanted-sans/woff2/WantedSansVariable.split.90.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="/static/vendor/fonts/wanted-sans/woff2/WantedSansVariable.split.88.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="/static/vendor/fonts/jetbrains-mono/jetbrains-mono-latin-400.woff2" crossorigin>
  <!-- 테마 부팅: 페인트 전에 data-skin 확정 (FOUC 방지).
       D1(ADR-3): 기본값이 macos → farshell로 바뀌었다. 이미 vt-skin을
       저장해 둔 사용자는 그 값을 그대로 쓴다(마이그레이션 없음) — 저장된
       값이 아예 없을 때만 새 기본값이 적용된다. 그 "없을 때"도 시스템이
       라이트 모드면 다크 스킨을 강제로 들이밀지 않고 유일한 라이트 스킨인
       notepad로 떨어진다(prefers-color-scheme 추종, D1 체크리스트) —
       사용자가 명시적으로 스킨을 고르면 그게 항상 이긴다. -->
  <script>
    (function(){
      try {
        var stored = localStorage.getItem('vt-skin');
        var valid = ['farshell','macos','catppuccin','windows','vscode','notepad'];
        // N14 — 가져온 테마(7번째 스킨)는 저장된 사본이 있을 때만 유효하다.
        // 색까지 여기서 심는다: 스킨 이름만 복원하고 색을 모듈 로드 뒤에
        // 적용하면 매번 기본 팔레트로 한 번 번쩍인다(FOUC).
        var imported = null;
        try { imported = JSON.parse(localStorage.getItem('vt-theme-imported') || 'null'); } catch (e2) {}
        if (imported && imported.tokens) {
          valid.push('imported');
          var body = '';
          for (var k in imported.tokens) {
            if (/^--color-[a-z0-9-]+$/.test(k) && typeof imported.tokens[k] === 'string') {
              body += k + ':' + imported.tokens[k] + ';';
            }
          }
          var st = document.createElement('style');
          st.id = 'vt-imported-theme';
          st.textContent = 'html[data-skin="imported"]{' + body + '}';
          document.head.appendChild(st);
        }
        var s;
        if (stored && valid.indexOf(stored) >= 0) {
          s = stored;
        } else {
          var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
          s = prefersLight ? 'notepad' : 'farshell';
        }
        document.documentElement.setAttribute('data-skin', s);
      } catch(e){}
    })();
  </script>
  <!-- 로그인 게이트 스타일.
       인라인으로 남는 이유는 예전과 같다 — 이 화면은 번들 CSS 도착 여부와
       무관하게 첫 페인트에 완성돼 있어야 한다(FOUC 방지). 대신 색은 전부
       `styles/theme/tokens.css`의 --color-* 토큰을 읽고, **폴백은 var()의
       두 번째 인자로만** 준다(farshell 기본 스킨 값). 하드코딩 hex를 규칙으로
       두면 토큰이 움직일 때 로그인 화면만 조용히 옛 색으로 남는다 —
       실제로 이전 버전이 애플 블루(#0a84ff)에 묶여 있어서, 앰버 액센트로
       바뀐 제품에 브라우저 기본 폼처럼 생긴 로그인이 붙어 있었다. -->
  <style>
    #login-gate{position:fixed;inset:0;z-index:100000;display:grid;place-items:center;
      padding:24px calc(20px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
      background:var(--color-bg-0,#08090a);color:var(--color-txt,#e8e9ea);
      font-family:var(--font-ui,-apple-system,BlinkMacSystemFont,system-ui,sans-serif);
      -webkit-font-smoothing:antialiased;}
    #login-gate[hidden]{display:none;}

    /* ── 확인 중(최초 프로브 · QR 티켓 교환) ──────────────────────────────
       링만 돌리고 끝내면 "무엇을 기다리는지"가 화면에 없다. 티켓 교환은
       비밀번호 확인과 체감 길이가 달라서(기기 등록까지 한다) 라벨을 gate.js가
       갈아끼운다 — 링은 같아도 문장이 상태를 말한다. */
    #login-spinner{display:flex;flex-direction:column;align-items:center;gap:14px;}
    #login-spinner[hidden]{display:none;}
    .login-spin-ring{width:22px;height:22px;border-radius:50%;
      border:2px solid var(--color-line-strong,rgb(255 255 255 / .14));
      border-top-color:var(--color-acc,#f0a860);
      animation:login-spin .7s linear infinite;}
    #login-spin-label{margin:0;font-size:var(--fs-sm,13.5px);color:var(--color-sub,#8e9296);}
    /* app.css의 vtSpin과 값이 같은 키프레임이지만, 번들 CSS 도착 전에도 돌아야
       하므로 여기 복제본을 남긴다(D6과 같은 이유). */
    @keyframes login-spin{to{transform:rotate(360deg)}}

    /* ── 폼 프레임 ────────────────────────────────────────────────────────
       라운드 사각형이 화면 한가운데 떠 있는 "로그인 카드"를 만들지 않는다.
       게이트는 전체 화면을 덮으므로 그 위에 뜰 무언가가 없고, 그림자는 높이를
       말할 때만 쓴다(DESIGN §4). 경계는 1px 선 하나. 480px 아래에서는 테두리와
       배경 단차를 아예 지워서 카드가 아니라 **화면 자체**가 되게 한다 —
       390px 폭에서 20px 여백 안에 카드를 또 그리면 남는 폭이 없다. */
    #login-form{width:min(380px,100%);box-sizing:border-box;
      background:var(--color-bg-1,#0e1011);
      border:1px solid var(--color-line,rgb(255 255 255 / .07));
      border-radius:var(--radius-lg,10px);padding:28px 24px;}
    #login-form[hidden]{display:none;}
    @media (max-width:480px){
      #login-form{background:none;border:none;border-radius:0;padding:0;}
    }

    /* 제품 표식: 자물쇠가 아니라 터미널이다. 자물쇠는 "잠겼다"만 말하고 이 화면이
       무엇인지는 말하지 않는다 — 문장이 이미 잠금을 말하고 있으니 마크는 제품을
       말하게 한다. 호스트 줄은 장식이 아니라 정보다: 터널 URL이 여러 개일 때
       지금 어느 맥에 로그인하는지가 여기서만 보인다. */
    .login-mark{display:block;color:var(--color-acc,#f0a860);margin:0 0 14px;}
    #login-form h1{margin:0 0 6px;font-size:var(--fs-lg,20px);font-weight:var(--weight-semibold,600);
      letter-spacing:var(--tracking-tight,-0.02em);line-height:var(--leading-tight,1.2);}
    #login-form .login-sub{margin:0;font-size:var(--fs-sm,13.5px);color:var(--color-sub,#8e9296);
      line-height:var(--leading-body,1.6);}
    #login-host{margin:2px 0 0;font-family:var(--font-mono,ui-monospace,monospace);
      font-size:var(--fs-2xs,11px);color:var(--color-faint,#5d6164);
      word-break:break-all;line-height:var(--leading-row,1.35);}
    .login-fields{margin-top:22px;}

    /* ── 입력 ─────────────────────────────────────────────────────────────
       라벨을 눈에 보이게 둔다. 플레이스홀더만 있으면 입력을 시작한 순간
       그 칸이 무엇이었는지가 사라지고, OTP 단계가 열리면 칸이 둘이 된다.
       글자 16px는 취향이 아니라 iOS 대응이다 — 그보다 작으면 포커스할 때
       사파리가 화면을 확대한다. */
    .login-label{display:block;margin:0 0 6px;font-size:var(--fs-xs,12.5px);
      color:var(--color-sub,#8e9296);font-weight:var(--weight-medium,500);}
    #login-form input{width:100%;box-sizing:border-box;min-height:42px;
      font-family:inherit;font-size:16px;padding:10px 12px;
      background:var(--color-bg-0,#08090a);color:var(--color-txt,#e8e9ea);
      border:1px solid var(--color-line,rgb(255 255 255 / .07));
      border-radius:var(--radius-sm,5px);
      transition:border-color var(--dur-fast,120ms) ease;}
    #login-form input::placeholder{color:var(--color-faint,#5d6164);}
    #login-form input:hover{border-color:var(--color-line-strong,rgb(255 255 255 / .14));}
    #login-form input:focus{outline:2px solid var(--color-acc,#f0a860);outline-offset:2px;
      border-color:var(--color-line-strong,rgb(255 255 255 / .14));}
    /* type=password 대신 text+마스킹 사용 → Chrome 비밀번호 저장 제안 자체를 차단 (시각적 마스킹은 유지) */
    #login-pass{-webkit-text-security:disc;text-security:disc;}

    /* OTP는 "비밀번호 다음에 붙는 칸"이 아니라 **별도 단계**다. 선 하나로
       끊어 주지 않으면 처음 보는 기기에서 갑자기 칸이 하나 늘어난 것처럼만
       보인다. */
    #login-otp-wrap{margin-top:18px;padding-top:18px;
      border-top:1px solid var(--color-line,rgb(255 255 255 / .07));}
    #login-otp-wrap[hidden]{display:none;}
    #login-form .login-otp-hint{margin:0 0 10px;font-size:var(--fs-xs,12.5px);
      color:var(--color-sub,#8e9296);line-height:var(--leading-body,1.6);}
    #login-otp{font-family:var(--font-mono,ui-monospace,monospace);
      letter-spacing:.34em;text-indent:.34em;text-align:center;font-variant-numeric:tabular-nums;}

    /* ── 주 액션 ──────────────────────────────────────────────────────────
       화면에 채움 버튼은 이것 하나뿐이다(DESIGN §10). hover/active를 밝기
       필터로 만들지 않고 --color-acc-dim 토큰으로 내린다 — filter는 스킨마다
       결과가 제각각이고, macos처럼 액센트 위 잉크 대비를 따로 맞춘 스킨에서
       그 계산을 무너뜨린다. */
    #login-submit{width:100%;margin-top:18px;min-height:42px;
      font-family:inherit;font-size:var(--fs-base,15px);font-weight:var(--weight-semibold,600);
      letter-spacing:var(--tracking-wide,0.04em);cursor:pointer;
      background:var(--color-acc-surface,var(--color-acc,#f0a860));color:var(--color-acc-ink,#17140f);
      border:1px solid transparent;border-radius:var(--radius-sm,5px);
      transition:background-color var(--dur-fast,120ms) ease;}
    #login-submit:hover:not(:disabled){background:var(--color-acc-dim,#b3803f);}
    #login-submit:active:not(:disabled){background:var(--color-acc-dim,#b3803f);}
    #login-submit:focus-visible{outline:2px solid var(--color-acc,#f0a860);outline-offset:2px;}
    /* 제출 중에도 버튼은 disabled다. 투명도만 낮추면 "눌렀는데 아무 일도 없는"
       화면이 되므로, 라벨을 gate.js가 갈아끼우고 여기서 링을 붙인다. */
    #login-submit:disabled{background:none;color:var(--color-muted,#73787c);
      border-color:var(--color-line-strong,rgb(255 255 255 / .14));cursor:default;}
    #login-submit[aria-busy="true"]{display:flex;align-items:center;justify-content:center;gap:8px;}
    #login-submit[aria-busy="true"]::before{content:"";width:13px;height:13px;border-radius:50%;
      border:2px solid var(--color-line-strong,rgb(255 255 255 / .14));
      border-top-color:var(--color-muted,#73787c);
      animation:login-spin .7s linear infinite;}

    /* ── 오류 ─────────────────────────────────────────────────────────────
       한 줄에 다 쓰면 "인증 코드가 올바르지 않습니다 (남은 시도 2회)"처럼
       사람이 읽어야 할 문장과 서버가 알려준 수치가 같은 무게로 붙는다.
       제목은 무슨 일인지, 보조 줄은 서버가 덧붙인 사실. */
    .login-err{display:flex;gap:9px;margin-top:16px;
      font-size:var(--fs-sm,13.5px);line-height:var(--leading-row,1.35);}
    .login-err[hidden]{display:none;}
    .login-err svg{flex:none;margin-top:1px;color:var(--color-st-error,#f06868);}
    #login-err-msg{color:var(--color-txt,#e8e9ea);}
    #login-err-detail{margin-top:3px;color:var(--color-sub,#8e9296);font-size:var(--fs-xs,12.5px);}
    #login-err-detail[hidden]{display:none;}

    /* ?next= 로 들어온 경우(N21 공유 링크의 device 모드). 로그인 뒤 원래 열려던
       다운로드로 돌아간다는 사실을 말해 두지 않으면, 파일을 누른 사람 눈에는
       난데없는 로그인 화면이다. */
    #login-next-note{margin:16px 0 0;padding:9px 11px;
      border:1px solid var(--color-line,rgb(255 255 255 / .07));border-radius:var(--radius-sm,5px);
      font-size:var(--fs-xs,12.5px);color:var(--color-sub,#8e9296);line-height:var(--leading-body,1.6);}
    #login-next-note[hidden]{display:none;}

    /* DESIGN §11 — 모션을 끈 사용자에게는 링 대신 정지한 액센트 호가 남고,
       상태는 옆의 문장이 말한다. */
    @media (prefers-reduced-motion:reduce){
      .login-spin-ring,#login-submit[aria-busy="true"]::before,#login-form input{animation:none;transition:none;}
    }
  </style>
</head>
<body>
  <!-- 로그인 게이트 — VT_TOKEN 설정 시 미인증 접속을 여기서 막는다 -->
  <div id="login-gate">
    <!-- 확인 중. role=status + aria-live로 스크린리더에도 단계 전환이 읽힌다
         (라벨 문구는 gate.js가 상황에 따라 바꾼다 — 프로브 / QR 기기 등록). -->
    <div id="login-spinner" role="status" aria-live="polite">
      <span class="login-spin-ring" aria-hidden="true"></span>
      <p id="login-spin-label">연결을 확인하는 중</p>
    </div>
    <form id="login-form" hidden autocomplete="off">
      <!-- D5: ui/icons.js와 같은 path(Lucide 'square-terminal') — 번들 로드 전에도
           보여야 해서 정적으로 둔다. 두 곳에 같은 도형이 적히는 건 알고 있고,
           그게 아이콘 라이브러리를 섞는 것보다 낫다. -->
      <svg class="login-mark" xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="m7 9 3 3-3 3"/><path d="M12 15h5"/></svg>
      <h1>FarShell</h1>
      <p class="login-sub">이 터미널에 접속하려면 비밀번호가 필요합니다.</p>
      <!-- 지금 어느 서버로 들어가는지. 터널 URL은 자주 바뀌고 맥이 둘일 수도 있다. -->
      <p id="login-host" hidden></p>
      <!-- 공유 링크(N21)로 들어와 로그인이 가로챈 경우에만 뜬다 -->
      <p id="login-next-note" hidden>로그인하면 열려던 공유 파일로 이어집니다.</p>

      <div class="login-fields">
        <label class="login-label" for="login-pass">비밀번호</label>
        <!-- type=text + CSS 마스킹: Chrome이 type=password 필드에만 붙이는 "비밀번호 저장" 팝업을 피하면서
             화면 상 노출은 -webkit-text-security로 그대로 가린다.
             readonly+onfocus 해제: Chrome은 autocomplete=off를 로그인성 필드에서 종종 무시하고
             자동완성 드롭다운을 띄운다 — 포커스 전까지 readonly로 막아 Chrome이 아예 자동완성
             대상으로 인식하지 못하게 한다(포커스 즉시 해제되므로 타이핑에는 영향 없음). -->
        <input id="login-pass" type="text" name="vt-key" autocomplete="off"
          autocorrect="off" autocapitalize="off" spellcheck="false"
          readonly onfocus="this.removeAttribute('readonly')"
          aria-label="비밀번호" />
        <!-- OTP 단계: 처음 보는 기기에서만, 그리고 'fsh otp setup'으로 연동한 뒤에만 나타난다 -->
        <div id="login-otp-wrap" hidden>
          <p class="login-otp-hint">처음 접속하는 기기입니다. 인증 앱의 6자리 코드를 입력하세요.</p>
          <label class="login-label" for="login-otp">인증 코드</label>
          <input id="login-otp" type="text" name="vt-otp" autocomplete="one-time-code"
            inputmode="numeric" pattern="[0-9]*" maxlength="6"
            autocorrect="off" autocapitalize="off" spellcheck="false"
            placeholder="000000" aria-label="인증 코드" />
        </div>
        <button type="submit" id="login-submit"><span id="login-submit-label">접속</span></button>
      </div>

      <!-- 오류는 두 줄이다: 무슨 일인지(제목) / 서버가 덧붙인 사실(보조). -->
      <div class="login-err" id="login-err" role="alert" hidden>
        <!-- ui/icons.js의 'alert-triangle'과 같은 path -->
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
        <div>
          <div id="login-err-msg"></div>
          <div id="login-err-detail" hidden></div>
        </div>
      </div>
    </form>
  </div>
  <script src="/static/js/gate.js"></script>
  <!-- D7: screenReaderMode가 터치 기기 기본 ON(M5)인데 정작 연결 끊김이 안 읽히던 문제 -->
  <div id="conn-status" role="status" aria-live="polite"></div>

  <!-- 터미널 검색 바 -->
  <div id="search-bar">
    <input id="search-input" class="vt-input" type="text" placeholder="검색..." aria-label="터미널 검색" />
    <!-- D5 관용구: ui/icons.js의 'chevron-down'과 같은 path. 이전 결과는 CSS로 뒤집는다. -->
    <button data-action="search.prev" aria-label="이전 결과" class="flipped"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
    <button data-action="search.next" aria-label="다음 결과"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
    <!-- D5: ui/icons.js의 'x'와 같은 path -->
    <button data-action="search.close" aria-label="검색 닫기"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
  </div>

  <!-- 상단 통합 바 -->
  <header id="topbar">
    <div class="traffic" aria-hidden="true"><i class="c1"></i><i class="c2"></i><i class="c3"></i></div>

    <!-- N37 §4 — 워크스페이스 칩("farshell / 호스트"). 내용은 shell/HeaderExtras.tsx
         (Solid, 지연 로드)가 채운다. 클릭 → 팔레트(§4: "@ 모드"는 60 §3이 생기면). -->
    <div id="vt-workspace-chip-slot"></div>

    <!-- 10-shell-layout.md §4 3단계 — **탭 = 열려 있는 워크트리**. 탭마다 자기
         pane 트리를 가진다(layout/store.js의 탭 집합). 세션 탭 줄(#tabs)은
         3단계에서 사라졌다 — 세션 목록·닫기·이름 변경·드래그는 레일(세션)로,
         이름·순서는 세션 레코드(core/store.js)로 옮겼다.
         탭 바는 flex 축소 대상(min-width:0)이라 0px까지 눌릴 수 있다.
         add-btn/chevron을 그 안에 두면 함께 사라져 좁은 화면에서 "새 세션"
         자체가 막힌다 — 항상 보여야 하는 컨트롤이라 밖(flex-shrink:0 형제)에 둔다. -->
    <div id="vt-wtabs" role="tablist" aria-label="워크트리 탭"></div>
    <div id="add-btn" data-action="session.add-menu" data-tip="새 세션" data-tip-sub="일반 터미널 / tmux" data-tip-side="bottom" role="button" tabindex="0" aria-haspopup="true" aria-label="새 세션"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></div>
    <div class="wt-chevron" data-action="session.tmux-list" data-tip="세션 프로파일" data-tip-side="bottom" role="button" tabindex="0" aria-label="세션 프로파일">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg>
    </div>

    <!-- 좁은 화면의 세션 관리 진입점. 탭 영역이 눌려도 전환·이름 변경·닫기가 남는다. -->
    <button id="voice-session-picker" type="button" aria-label="세션 관리" aria-haspopup="dialog"
      aria-expanded="false" data-action="session.manager">세션</button>

    <div class="spacer"></div>

    <!-- L7: 마이크를 상단바에서 이관했다(accent 버튼 1개 회수, AFTER 다이어그램의
         최종 상단바 = 탭+ +팔레트뿐). 이제 그 자리는 없고, 정적 마크업은
         #vt-rail-mic-slot(데스크톱 홈)에 있다 — keybar.js가 부팅 시 포인터
         타입에 따라 keybar 쪽으로 옮길 수도 있다(아래 #keybar-slot-mic 참고). -->

    <!-- L6: 커맨드 팔레트 진입점으로 재배정 — 예전엔 search.toggle(터미널 내 검색)이었다.
         팔레트가 세션·파일·명령을 아우르는 "확인" 진입점(ADR-8)이 되면서, 이 아이콘은
         모바일 포함 모든 뷰포트에서 상시 노출된다(legacy.css의 max-width:719px 숨김
         목록에서 제외). 터미널 내 검색 자체는 Ctrl/Cmd+F로 그대로
         쓸 수 있다(팔레트 `/` 접두사는 60-settings-palette.md §3부터 파일 검색으로 바뀌었다) — ⋯ 메뉴의 동일 항목("터미널 내 검색"·"빠른 열기")은 L1 잔여
         항목에서 제거했다(상단바 ↔ ⋯ 중복 제거). -->
    <button id="palette-toggle" class="vt-icon-btn" data-action="quickopen.open" aria-label="빠른 열기" data-tip="빠른 열기" data-tip-sub="Ctrl/Cmd+K" data-tip-side="bottom">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    </button>
    <!-- N37 §4 — 「연결된 화면」. shell/HeaderExtras.tsx가 채우고, 데이터가 없으면
         (활성 세션이 tmux가 아님 등) 스스로 빈 상태로 남는다. -->
    <div class="caption" aria-hidden="true"><span>&#9472;</span><span>&#9723;</span><span class="cls">&#10005;</span></div>
  </header>

  <!-- N38(70-mobile.md §1) — 모바일 상단 24px. compact(<720px)에서만 보인다.
       #topbar는 그대로 둔다(세션 탭·팔레트 진입점을 이미 compact에서도
       제공한다, L4/L6 주석) — 이 바는 그 아래 얇은 두 번째 줄로 호스트
       컨텍스트 + 대기 수만 얹는다(2.1.0엔 호스트 전환이 없어 칩은 정적
       텍스트, N39가 붙는 2.1.2부터 탭 가능해진다). 내용은
       layout/mobile-nav.js가 채운다. -->
  <div id="vt-mnav-top" aria-label="상태 요약">
    <span id="vt-mnav-host-chip">farshell</span>
    <span id="vt-mnav-waiting" hidden></span>
  </div>

  <!-- L4: 좌측 rail — ADR-8("⋯ 폐지 → 좌측 rail(포인터) + 커맨드 팔레트(키보드)")의
       포인터 경로. compact(<720px)에서는 CSS로 통째로 숨는다(팔레트 + 바텀시트가
       대신한다). 항목 7개는 팔레트(L6)의 기본/설정 명령과 내용이 같다(문서 §3
       "포인터 경로와 키보드 경로가 나뉘되 내용은 동일") — 파일/큐/스니펫/포트는 이미
       있는 모달(viewer.show/queue.show/snippets.show/ports.show)을 그대로 열 뿐이고, "세션"만
       진짜 새 임베디드 패널이다(연결된 화면 관리는 C3 의존이라 지금은 목록만).
       사용량은 U 마일스톤 전이라 .needs-usage로 상시 숨김. -->
  <!-- N36 §5 — 워크트리 레일 252px(Solid, 지연 로드). 2.1.0에서 기존 48px
       아이콘 레일(아래 #vt-rail)을 시각적으로 대체한다 — #vt-rail 자체와
       #vt-rail-panel/#vt-rail-settings-tpl(데스크톱 마이크·테마 칩이 사는
       유일한 자리)은 DOM에서 지우지 않았다: CSS로만 숨기고, 새 레일의
       "⋯ 더보기" 메뉴가 그 버튼들을 그대로 다시 누른다(shell/Rail.tsx). -->
  <div id="vt-wgrail-slot"></div>
  <nav id="vt-rail" aria-label="사이드바">
    <button type="button" class="vt-rail-btn" id="vt-rail-session" data-rail="session" aria-label="세션" aria-pressed="false" data-tip="세션" data-tip-side="right">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="18" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      <span class="vt-rail-badge" id="vt-rail-badge-session" hidden></span>
    </button>
    <!-- N35 §6 — 「파일」 버튼은 없어졌다. 모달 코드 뷰어가 사라지면서 그
         버튼이 열 것 자체가 없어졌고, 파일을 고르는 자리는 팔레트(상단바 🔍 ·
         Mod+K)로 옮겨갔다. 새 레일의 "⋯ 더보기"에는 「파일 열기」 항목이 있고
         그건 팔레트를 연다(js/panels/viewer-lazy.js의 viewer.show). -->
    <button type="button" class="vt-rail-btn" id="vt-rail-queue" data-rail="queue" data-action="queue.show" aria-label="프롬프트 큐" data-tip="프롬프트 큐" data-tip-side="right">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      <span class="vt-rail-badge" id="vt-rail-badge-queue" hidden></span>
    </button>
    <button type="button" class="vt-rail-btn" id="vt-rail-snippets" data-rail="snippets" data-action="snippets.show" aria-label="프롬프트 스니펫" data-tip="프롬프트 스니펫" data-tip-side="right">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 2h6a2 2 0 0 1 2 2v1h1a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h1V4a2 2 0 0 1 2-2z"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/></svg>
    </button>
    <!-- 50-files-share.md §4 — 파일 저장소 탭. 위 주석의 「파일」(코드 뷰어)과는
         다른 것이다: 그건 저장소의 소스를 읽는 화면이고, 이건 업로드된 파일을
         관리·공유하는 화면이다(dock 파일 탭과 같은 렌더러). -->
    <button type="button" class="vt-rail-btn" id="vt-rail-files" data-rail="files" data-action="files.show" aria-label="파일" data-tip="파일" data-tip-sub="저장소 · 공유 링크" data-tip-side="right">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>
    </button>
    <button type="button" class="vt-rail-btn needs-ports" id="vt-rail-ports" data-rail="ports" data-action="ports.show" aria-label="포트" data-tip="포트 대시보드" data-tip-side="right">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M6 7V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2"/><line x1="7" y1="12" x2="7" y2="16"/><line x1="12" y1="12" x2="12" y2="16"/><line x1="17" y1="12" x2="17" y2="16"/></svg>
      <span class="vt-rail-badge" id="vt-rail-badge-ports" hidden></span>
    </button>
    <!-- U 마일스톤(읽기 전용 clauth 사용량) 전이라 /api/capabilities가 usage를
         아예 안 돌려준다 — agent/status.js가 다른 needs-*와 같은 방식(가짐:
         실패 시 기본 표시 폴백까지 동일)으로 숨긴다. 정적 hidden을 안 거는
         이유는 그 폴백과 일관성을 맞추기 위해서다 — U가 실제로 caps.usage를
         추가하는 순간 이 파일을 다시 안 건드려도 자동으로 나타난다. -->
    <button type="button" class="vt-rail-btn needs-usage" id="vt-rail-usage" data-rail="usage" data-action="usage.open" aria-label="사용량" data-tip="사용량" data-tip-side="right">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
    </button>
