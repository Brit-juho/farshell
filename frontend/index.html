  <!-- 로그인 게이트 스타일 (모든 스킨의 테마 변수 재사용) -->
  <style>
    #login-gate{position:fixed;inset:0;z-index:100000;display:flex;align-items:center;justify-content:center;
      background:var(--win,#1c1c1e);color:var(--txt,#e6e6ea);font-family:var(--ui,system-ui,sans-serif);}
    #login-gate[hidden]{display:none;}
    #login-spinner{width:26px;height:26px;border-radius:50%;
      border:3px solid var(--line,rgba(255,255,255,.15));border-top-color:var(--acc,#0a84ff);
      animation:login-spin .8s linear infinite;}
    #login-spinner[hidden]{display:none;}
    @keyframes login-spin{to{transform:rotate(360deg)}}
    #login-form{width:min(340px,86vw);background:var(--menu,#2a2a2c);
      border:1px solid var(--line,rgba(255,255,255,.08));border-radius:var(--wrad,12px);
      padding:28px 24px;box-shadow:0 12px 40px rgba(0,0,0,.4);text-align:center;}
    #login-form[hidden]{display:none;}
    #login-form .login-icon{font-size:34px;line-height:1;margin-bottom:12px;}
    #login-form h1{font-size:18px;font-weight:600;margin:0 0 4px;}
    #login-form .login-sub{font-size:13px;color:var(--sub,#8e8e96);margin:0 0 20px;}
    #login-form input{width:100%;box-sizing:border-box;font-size:16px;padding:11px 13px;
      background:var(--win,#1c1c1e);color:var(--txt,#e6e6ea);
      border:1px solid var(--line,rgba(255,255,255,.14));border-radius:var(--trad,7px);
      outline:none;margin-bottom:12px;}
    #login-form input:focus{border-color:var(--acc,#0a84ff);}
    /* type=password 대신 text+마스킹 사용 → Chrome 비밀번호 저장 제안 자체를 차단 (시각적 마스킹은 유지) */
    #login-pass{-webkit-text-security:disc;text-security:disc;}
    #login-form button{width:100%;font-size:15px;font-weight:600;padding:11px;cursor:pointer;
      background:var(--acc,#0a84ff);color:var(--acc-ink,#fff);border:none;border-radius:var(--trad,7px);
      transition:filter .12s, transform .08s;}
    #login-form button:hover:not(:disabled){filter:brightness(1.1);}
    #login-form button:active:not(:disabled){transform:scale(.97);filter:brightness(.95);}
    #login-form button:disabled{opacity:.55;cursor:default;}
    #login-form .login-err{color:var(--err,#ff453a);font-size:13px;margin-top:12px;min-height:1em;}
    #login-form .login-err[hidden]{display:none;}
    #login-otp-wrap[hidden]{display:none;}
    #login-form .login-otp-hint{font-size:12px;color:var(--sub,#8e8e96);margin:0 0 8px;text-align:left;line-height:1.45;}
    #login-otp{letter-spacing:.4em;text-align:center;font-variant-numeric:tabular-nums;}

<body>
  <!-- 로그인 게이트 — VT_TOKEN 설정 시 미인증 접속을 여기서 막는다 -->
  <div id="login-gate">
    <div id="login-spinner"></div>
    <form id="login-form" hidden autocomplete="off">
      <div class="login-icon">🔒</div>
      <h1>FarShell</h1>
      <p class="login-sub">접속하려면 비밀번호를 입력하세요</p>
      <!-- type=text + CSS 마스킹: Chrome이 type=password 필드에만 붙이는 "비밀번호 저장" 팝업을 피하면서
           화면 상 노출은 -webkit-text-security로 그대로 가린다.
           readonly+onfocus 해제: Chrome은 autocomplete=off를 로그인성 필드에서 종종 무시하고
           자동완성 드롭다운을 띄운다 — 포커스 전까지 readonly로 막아 Chrome이 아예 자동완성
           대상으로 인식하지 못하게 한다(포커스 즉시 해제되므로 타이핑에는 영향 없음). -->
      <input id="login-pass" type="text" name="vt-key" autocomplete="off"
        autocorrect="off" autocapitalize="off" spellcheck="false"
        readonly onfocus="this.removeAttribute('readonly')"
        placeholder="비밀번호" aria-label="비밀번호" />
      <!-- OTP 단계: 처음 보는 기기에서만, 그리고 'fsh otp setup'으로 연동한 뒤에만 나타난다 -->
      <div id="login-otp-wrap" hidden>
        <p class="login-otp-hint">처음 접속하는 기기입니다. 인증 앱의 6자리 코드를 입력하세요.</p>
        <input id="login-otp" type="text" name="vt-otp" autocomplete="one-time-code"
          inputmode="numeric" pattern="[0-9]*" maxlength="6"
          autocorrect="off" autocapitalize="off" spellcheck="false"
          placeholder="000000" aria-label="인증 코드" />
      </div>
      <button type="submit" id="login-submit">접속</button>
      <div class="login-err" id="login-err" hidden></div>
    </form>
  </div>
  <script>
    // 로그인 게이트: /api/capabilities로 인증 여부 확인.
    //  - 200 → 인증됨(또는 서버에 인증 미설정) → 게이트 숨김
    //  - 401 → 비밀번호 폼 노출 → POST /api/auth 성공 시 24h 쿠키 발급 후 새로고침
    //
    // 처음 보는 기기이고 서버에서 'fsh otp setup'으로 OTP를 연동해 둔 경우에만
    // 401 {error:"otp_required"}가 돌아오고, 그때 6자리 입력칸이 추가로 열린다.
    // OTP 미연동이면 이 분기가 아예 발생하지 않아 기존 동작과 동일하다.
    (function(){
      var gate=document.getElementById('login-gate');
      var spin=document.getElementById('login-spinner');
      var form=document.getElementById('login-form');
      var pass=document.getElementById('login-pass');
      var otpWrap=document.getElementById('login-otp-wrap');
      var otp=document.getElementById('login-otp');
      var btn=document.getElementById('login-submit');
      var err=document.getElementById('login-err');
      var params=new URLSearchParams(location.search);

      // 비밀번호 입력창은 한/영 전환 상태와 무관하게 항상 영문으로 들어가야 한다.
      // 한글 IME가 켜진 채로 입력하면 실제 눌린 물리 키와 다른 완성형 한글이 조합되므로,
      // 두벌식 표준 자판 매핑으로 조합된 한글(완성형 음절 + 홑자모)을 분해해 원래 눌렀을
      // 영문 키로 역변환한다. 조합이 끝나는 시점(compositionend)에만 되돌린다 —
      // 조합 중간(input)에 값을 바꾸면 IME 조합 상태 자체가 깨진다.
      var CHO=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
      var JUNG=['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
      var JONG=['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
      var KEY={
        'ㄱ':'r','ㄲ':'R','ㄴ':'s','ㄷ':'e','ㄸ':'E','ㄹ':'f','ㅁ':'a','ㅂ':'q','ㅃ':'Q',
        'ㅅ':'t','ㅆ':'T','ㅇ':'d','ㅈ':'w','ㅉ':'W','ㅊ':'c','ㅋ':'z','ㅌ':'x','ㅍ':'v','ㅎ':'g',
        'ㅏ':'k','ㅐ':'o','ㅑ':'i','ㅒ':'O','ㅓ':'j','ㅔ':'p','ㅕ':'u','ㅖ':'P',
        'ㅗ':'h','ㅛ':'y','ㅜ':'n','ㅠ':'b','ㅡ':'m','ㅣ':'l',
        'ㅘ':'hk','ㅙ':'ho','ㅚ':'hl','ㅝ':'nj','ㅞ':'np','ㅟ':'nl','ㅢ':'ml'
      };
      // 종성(받침)은 겹받침 조합 시 두 키 입력이고, 쌍자음 받침은 초성과 달리 shift 없이
      // 같은 키를 두 번 눌러 만들어진다(ㄲ=rr, ㅆ=tt) — 초성 KEY(R/T)와 다르다.
      var JONG_KEY={
        '':'','ㄱ':'r','ㄲ':'rr','ㄴ':'s','ㄷ':'e','ㄹ':'f','ㅁ':'a','ㅂ':'q',
        'ㅅ':'t','ㅆ':'tt','ㅇ':'d','ㅈ':'w','ㅊ':'c','ㅋ':'z','ㅌ':'x','ㅍ':'v','ㅎ':'g',
        'ㄳ':'rt','ㄵ':'sw','ㄶ':'sg','ㄺ':'fr','ㄻ':'fa','ㄼ':'fq','ㄽ':'ft','ㄾ':'fx','ㄿ':'fv','ㅀ':'fg','ㅄ':'qt'
      };
      function hangulCharToKeys(ch){
        var code=ch.codePointAt(0);
        if(code>=0xAC00 && code<=0xD7A3){
          var s=code-0xAC00;
          var l=CHO[Math.floor(s/588)], v=JUNG[Math.floor((s%588)/28)], t=JONG[s%28];
          return (KEY[l]||'')+(KEY[v]||'')+(t===''?'':(JONG_KEY[t]||''));
        }
        if(KEY[ch]!==undefined) return KEY[ch]; // 조합 안 끝난 홑자모(ㄱ, ㅏ 등)
        return ch;
      }
      function hasHangul(str){ return /[ㄱ-ㆎ가-힣]/.test(str); }
      function fixKoreanInput(str){
        if(!hasHangul(str)) return str;
        var out='';
        for(var i=0;i<str.length;i++){ out+=hangulCharToKeys(str[i]); }
        return out;
      }

      function hideGate(){ gate.hidden=true; }
      function showForm(){ spin.hidden=true; form.hidden=false;
        setTimeout(function(){ try{ (otpWrap.hidden?pass:otp).focus(); }catch(e){} }, 50); }
      function showErr(m){ err.textContent=m; err.hidden=false; btn.disabled=false; }
      // 자격증명 파라미터를 URL에서 지우고 재로드 — 히스토리/공유 링크에 남지 않게 한다.
      function reloadClean(){
        params.delete('ticket'); params.delete('token');
        var q=params.toString();
        location.replace(location.pathname+(q?'?'+q:'')+location.hash);
      }

      // 1회용 기기 등록 티켓(QR로 들어온 경우) — 스캔 자체가 등록 승인이다.
      var ticket=params.get('ticket');
      if(ticket){
        fetch('/api/auth',{method:'POST',credentials:'include',
          headers:{'Content-Type':'application/json'},body:JSON.stringify({ticket:ticket})})
        .then(function(r){
          if(r.ok){ reloadClean(); }
          else { showForm(); showErr('등록 링크가 만료되었습니다. 비밀번호로 접속하세요.'); }
        }).catch(function(){ showForm(); });
        return;
      }

      // URL에 ?token= 이 있으면(레거시 링크) 그 토큰으로 프로브 → 통과 시 terminal.js가 쿠키 교환
      var urlTok=params.get('token');
      var probe='/api/capabilities'+(urlTok?('?token='+encodeURIComponent(urlTok)):'');
      fetch(probe,{credentials:'include'}).then(function(r){
        if(r.status===401){ showForm(); } else { hideGate(); }
      }).catch(function(){ hideGate(); });

      // IME 조합이 끝날 때마다(음절 하나가 완성될 때마다) 한글이 섞여 있으면 즉시 되돌린다.
      pass.addEventListener('compositionend',function(){
        var fixed=fixKoreanInput(pass.value);
        if(fixed!==pass.value){ pass.value=fixed; }
      });

      form.addEventListener('submit',function(e){
        e.preventDefault();
        var v=fixKoreanInput(pass.value); if(!v) return;
        if(v!==pass.value) pass.value=v; // 조합 중 상태로 제출된 경우 대비한 마지막 안전망
        var payload={token:v};
        if(!otpWrap.hidden){
          var code=(otp.value||'').replace(/\D/g,'');
          if(code.length!==6){ showErr('6자리 코드를 입력하세요'); return; }
          payload.otp=code;
        }
        btn.disabled=true; err.hidden=true;
        fetch('/api/auth',{method:'POST',credentials:'include',
          headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
        .then(function(r){
          if(r.ok){ location.reload(); return; }
          return r.json().catch(function(){ return {}; }).then(function(d){
            if(d.error==='otp_required'){
              otpWrap.hidden=false; btn.disabled=false; err.hidden=true;
              setTimeout(function(){ try{ otp.focus(); }catch(e){} },50);
              return;
            }
            if(d.error==='otp_invalid'){
              otpWrap.hidden=false;
              showErr('인증 코드가 올바르지 않습니다'+(d.remaining!=null?' (남은 시도 '+d.remaining+'회)':''));
              try{ otp.value=''; otp.focus(); }catch(e){}
              return;
            }
            if(d.error==='otp_locked'){
              showErr('시도 횟수를 초과했습니다. '+Math.ceil((d.retry_after||600)/60)+'분 후 다시 시도하세요.');
              return;
            }
            if(d.error==='ticket_invalid'){ showErr('등록 링크가 만료되었습니다'); return; }
            showErr('비밀번호가 올바르지 않습니다');
            try{ pass.select(); }catch(e){}
          });
        }).catch(function(){ showErr('연결 오류'); });
      });
    })();
  </script>
  <div id="conn-status"></div>

  <!-- 터미널 검색 바 -->
  <div id="search-bar">
    <input id="search-input" type="text" placeholder="검색..." aria-label="터미널 검색" />
    <button onclick="searchPrev()" aria-label="이전 결과">▲</button>
    <button onclick="searchNext()" aria-label="다음 결과">▼</button>
    <button onclick="closeSearch()" aria-label="검색 닫기">✕</button>
  </div>

  <!-- 상단 통합 바 -->
  <header id="topbar">
    <div class="traffic" aria-hidden="true"><i class="c1"></i><i class="c2"></i><i class="c3"></i></div>

    <!-- tab이 많아지면 #tabs는 flex 축소 대상(min-width:0)이라 0px까지 눌릴 수 있다.
         add-btn/chevron을 그 안에 두면 탭과 함께 사라져 좁은 화면에서 "새 세션" 자체가
         막힌다 — 항상 보여야 하는 컨트롤이라 #tabs 밖(flex-shrink:0 형제)으로 둔다. -->
    <div id="tabs"></div>
    <div id="add-btn" onclick="showAddMenu(event)" title="새 세션 (일반 터미널 / tmux)" role="button" tabindex="0" aria-haspopup="true" aria-label="새 세션">+</div>
    <div class="wt-chevron" onclick="showTmuxSessions()" title="세션 프로파일" role="button" aria-label="세션 프로파일">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg>
    </div>

    <!-- 좁은 화면의 세션 관리 진입점. 탭 영역이 눌려도 전환·이름 변경·닫기가 남는다. -->
    <button id="voice-session-picker" type="button" aria-label="세션 관리" aria-haspopup="dialog"
      aria-expanded="false" onclick="openSessionManager()">세션</button>

    <div class="spacer"></div>

    <!-- 음성 입력 — 상단 바로 통합 (voice.js 계약: #mic-btn-wrap + .label + .recording) -->
    <button id="mic-btn-wrap" class="tbtn mic needs-voice" onclick="toggleRecording()" aria-label="음성 입력 (탭하여 녹음)" title="음성 입력">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v4"/></svg>
      <span class="label">음성 입력</span>
    </button>

    <button class="tbtn" onclick="toggleSearch()" aria-label="검색" title="검색">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    </button>
    <button id="grid-toggle" class="tbtn" onclick="toggleGridView()" aria-label="Grid 뷰" title="모든 tmux 세션 라이브 프리뷰">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    </button>
    <button id="viewer-toggle" class="tbtn needs-fs" onclick="showViewer()" aria-label="코드 뷰어" title="코드 뷰어 (Ctrl+Shift+E)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
    </button>
    <button class="tbtn more" id="more-btn" onclick="toggleMoreMenu(event)" aria-label="더보기" aria-haspopup="true" aria-expanded="false" title="더보기">⋯</button>

    <div class="caption" aria-hidden="true"><span>&#9472;</span><span>&#9723;</span><span class="cls">&#10005;</span></div>
  </header>

  <!-- ⋯ 팝업 메뉴 -->
  <div id="more-menu" role="menu" aria-label="더보기 메뉴">
    <div class="mlabel">세션</div>
    <button class="mi" role="menuitem" onclick="showTmuxSessions()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3M13 15h4"/></svg>tmux 세션
    </button>
    <label class="mi" id="auto-mac-toggle" role="menuitemcheckbox"
      title="새 세션 생성 시 맥북에서도 iTerm 창이 자동으로 열림">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/></svg>
      맥에서도 열기
      <input type="checkbox" id="auto-mac-checkbox" />
    </label>
    <button class="mi" role="menuitem" onclick="openSessionOnMac()"
      title="지금 보고 있는 tmux 세션을 맥 iTerm에 새 창으로 attach">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
      이 세션 맥에서 열기
    </button>

    <div class="msep"></div>
    <div class="mlabel">음성 · 파일</div>
    <button class="mi needs-voice" id="voiceonly-btn" role="menuitem" onclick="toggleVoiceOnly()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1v-6h3zM3 19a2 2 0 0 0 2 2h1v-6H3z"/></svg>음성 전용 모드
    </button>
    <button class="mi needs-voice" id="mediakey-btn" role="menuitem" onclick="toggleMediaKeyTrigger()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>이어폰 미디어키
    </button>
    <label class="mi" id="upload-btn" role="menuitem">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05 12.25 20.24a5 5 0 0 1-7.07-7.07l9.19-9.19a3.5 3.5 0 0 1 4.95 4.95l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>파일 업로드
      <input type="file" id="file-input" style="display:none" onchange="uploadFile(this)" />
    </label>

    <button class="mi needs-fs" id="viewer-btn" role="menuitem" onclick="showViewer()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>코드 뷰어
    </button>
    <button class="mi" id="queue-btn" role="menuitem" onclick="showQueue()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>프롬프트 큐
    </button>
    <button class="mi needs-ports" id="ports-btn" role="menuitem" onclick="showPorts()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M6 7V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2"/><line x1="7" y1="12" x2="7" y2="16"/><line x1="12" y1="12" x2="12" y2="16"/><line x1="17" y1="12" x2="17" y2="16"/></svg>포트
    </button>

    <div class="msep"></div>
    <div class="mlabel">설정</div>
    <button class="mi" role="menuitem" onclick="showGuide()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      가이드 보기
    </button>
    <button class="mi needs-push" id="push-btn" role="menuitem" onclick="togglePush()"
      title="앱을 닫아도 작업 완료 알림을 받습니다">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span id="push-label">푸시 알림</span>
    </button>
    <label class="mi" id="autocopy-toggle" role="menuitemcheckbox"
      title="드래그 선택 · vim/tmux copy-mode(OSC52) · fsh clip(맥 클립보드 폴링) 전부 자동 동기화 여부. 꺼도 우클릭/Ctrl+Shift+C로 수동 복사는 가능">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M9 4H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-4"/></svg>
      드래그 시 자동 복사
      <input type="checkbox" id="autocopy-checkbox" />
    </label>

    <div class="msep"></div>
    <div class="mlabel">테마</div>
    <div class="theme-row" id="theme-row">
      <button class="theme-chip" data-skin="macos" onclick="setVtSkin('macos')"><span class="dot" style="background:#0a84ff"></span>macOS</button>
      <button class="theme-chip" data-skin="catppuccin" onclick="setVtSkin('catppuccin')"><span class="dot" style="background:#cba6f7"></span>Catppuccin</button>
      <button class="theme-chip" data-skin="windows" onclick="setVtSkin('windows')"><span class="dot" style="background:#4cc2ff"></span>Windows</button>
      <button class="theme-chip" data-skin="vscode" onclick="setVtSkin('vscode')"><span class="dot" style="background:#007acc"></span>VS Code</button>
      <button class="theme-chip" data-skin="notepad" onclick="setVtSkin('notepad')"><span class="dot" style="background:#0060df;border:1px solid #ccc"></span>Notepad</button>
    </div>
  </div>

  <!-- 터미널 / Grid -->
  <div id="terminal-container"></div>
  <div id="grid-view">
    <div id="grid-cards"></div>
  </div>

  <!-- 음성 상태 텍스트 — 상단 바 아래 떠 있는 pill (녹음 중/처리 중/권한 필요/인식 결과) -->
  <div id="mic-status" role="status" aria-live="polite"></div>

  <!-- 모바일 특수키 바 (keybar) — 소프트 키보드에 없는 Esc/Tab/화살표/Ctrl 등을 PTY로 전송.
       기본 hidden; terminal.js가 터치 기기(pointer:coarse)에서만 노출하고 배선/위치 조정. -->
  <div id="keybar" role="toolbar" aria-label="특수키" hidden>
    <div id="keybar-keys">
      <button type="button" class="kb" data-key="esc">Esc</button>
      <button type="button" class="kb kb-mod" data-mod="ctrl" aria-pressed="false">Ctrl</button>
      <button type="button" class="kb" data-key="tab">Tab</button>
      <button type="button" class="kb kb-arrow" data-key="up" aria-label="위쪽 화살표">↑</button>
      <button type="button" class="kb kb-arrow" data-key="down" aria-label="아래쪽 화살표">↓</button>
      <button type="button" class="kb kb-arrow" data-key="left" aria-label="왼쪽 화살표">←</button>
      <button type="button" class="kb kb-arrow" data-key="right" aria-label="오른쪽 화살표">→</button>
      <button type="button" class="kb" data-seq="|">|</button>
      <button type="button" class="kb" data-seq="/">/</button>
      <button type="button" class="kb" data-seq="~">~</button>
      <button type="button" class="kb" data-seq="-">-</button>
    </div>
    <!-- 접기/펴기 토글 — 스크롤 영역 밖에 고정되어 항상 보임 -->
    <button type="button" id="keybar-toggle" aria-label="특수키 바 접기" aria-expanded="true" title="특수키 바 접기/펴기">▾</button>
  </div>

  <script src="/static/vendor/xterm.min.js"></script>
  <script src="/static/vendor/addon-fit.min.js"></script>
  <script src="/static/vendor/addon-search.min.js"></script>
  <!-- 이모지 등 wide 문자 폭 계산을 최신 유니코드 기준으로 맞춤 — 없으면 xterm.js가 구버전
       Unicode 6 폭 테이블을 써서 최근 이모지를 좁게(1칸) 오판해, 다음 글자와 겹쳐 보인다. -->
  <script src="/static/vendor/addon-unicode11.min.js"></script>
  <!-- GPU 렌더러 — 기본(DOM) 렌더러는 활발한 스트리밍(TUI 등)에서 CPU/메모리 비용이 크다.
       WebGL 우선 시도, 실패(GPU/드라이버 미지원) 시 Canvas로 폴백. -->
  <script src="/static/vendor/addon-webgl.min.js"></script>
  <script src="/static/vendor/addon-canvas.min.js"></script>
  <script src="/static/vendor/nacl.min.js"></script>
  <script src="/static/vendor/nacl-util.min.js"></script>
  <!-- 코드 뷰어 문법 하이라이팅 (P2). 테마 CSS는 쓰지 않는다 —
       색은 app.css에서 스킨 토큰으로 매핑해야 notepad(라이트)까지 따라간다. -->
  <script src="/static/vendor/highlight.min.js"></script>

  <!-- ESM 진입점. legacy 기능의 의존 순서는 bootstrap.js manifest에서만 관리한다. -->
  <script type="module" src="/static/js/bootstrap.js"></script>

  <!-- ⋯ 메뉴 열고닫기 (전역 상태 불필요, 여기 인라인) -->
  <script>
    function toggleMoreMenu(ev) {
      if (ev) ev.stopPropagation();
      const m = document.getElementById('more-menu');
      const btn = document.getElementById('more-btn');
      const open = m.classList.toggle('open');
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    }
    document.addEventListener('click', (e) => {
      const m = document.getElementById('more-menu');
      const btn = document.getElementById('more-btn');
      if (m.classList.contains('open') && !m.contains(e.target) && e.target !== btn && !btn.contains(e.target)) {
        m.classList.remove('open');
        btn.setAttribute('aria-expanded', 'false');
      }
    });
    // 메뉴 안에서 토글(맥에서 열기/파일)이 아닌 액션 클릭 시 메뉴 닫기
    document.getElementById('more-menu').addEventListener('click', (e) => {
      const item = e.target.closest('.mi');
      if (item && !item.querySelector('input') && item.id !== 'voiceonly-btn' && item.id !== 'mediakey-btn') {
        document.getElementById('more-menu').classList.remove('open');
      }
    });
    // + 버튼 키보드 접근
    document.getElementById('add-btn').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); showAddMenu(e); }
    });
    // "맥에서도 열기" — 기본 체크 ON, 선택은 localStorage에 기억 (폰에서 끄면 유지됨)
    (function initAutoMac() {
      const cb = document.getElementById('auto-mac-checkbox');
      if (!cb) return;
      cb.checked = (localStorage.getItem('vt_auto_mac') ?? 'on') !== 'off';
      cb.addEventListener('change', () => {
        localStorage.setItem('vt_auto_mac', cb.checked ? 'on' : 'off');
      });
    })();
    // "드래그 시 자동 복사" — 기본 체크 ON, 선택은 localStorage에 기억 (terminal.js가 매 드래그마다 읽음)
    (function initAutoCopy() {
      const cb = document.getElementById('autocopy-checkbox');
      if (!cb) return;
      cb.checked = (localStorage.getItem('vt_autocopy_on_select') ?? 'on') !== 'off';
      cb.addEventListener('change', () => {
        localStorage.setItem('vt_autocopy_on_select', cb.checked ? 'on' : 'off');
      });
    })();
  </script>
</body>
</html>
